<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora News — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    button {
      cursor: pointer;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: 0;
      padding: 10px 15px;
      border-radius: 6px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .publish,
    .save {
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 7px;
      color: white;
      font-weight: bold;
    }

    .publish {
      background: #b91c1c;
      width: 100%;
    }

    .save {
      background: #2563eb;
    }

    .cancel {
      margin-top: 20px;
      margin-left: 8px;
      padding: 13px 18px;
      border: 0;
      border-radius: 7px;
      background: #6b7280;
      color: white;
      font-weight: bold;
    }

    .article {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      padding: 15px;
      margin-top: 14px;
    }

    .article h3 {
      margin: 0 0 7px;
    }

    .meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .edit-btn {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 9px 14px;
      border-radius: 6px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: 0;
      padding: 9px 14px;
      border-radius: 6px;
      margin-left: 6px;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    #editCard {
      display: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 17px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>NEXORA NEWS — ADMIN</h1>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<main>

  <!-- PUBLISH -->
  <section class="card">
    <h2>Publish New Article</h2>

    <form id="articleForm">

      <label>Headline</label>
      <input id="title" required>

      <label>Category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>London</option>
        <option>UK</option>
        <option>World</option>
        <option>Business</option>
        <option>Technology</option>
        <option>Sports</option>
        <option>Video</option>
      </select>

      <label>Short Description</label>
      <textarea id="excerpt" required></textarea>

      <label>Article Image URL</label>
      <input id="image_url" type="url">

      <label>Article Body</label>
      <textarea id="body" required></textarea>

      <label>Author</label>
      <input id="author" value="Marian" required>

      <button class="publish" type="submit">
        Publish Article
      </button>

    </form>

    <div id="message"></div>
  </section>


  <!-- EDIT -->
  <section class="card" id="editCard">

    <h2>Edit Article</h2>

    <input type="hidden" id="editId">

    <label>Headline</label>
    <input id="editTitle">

    <label>Category</label>
    <select id="editCategory">
      <option>London</option>
      <option>UK</option>
      <option>World</option>
      <option>Business</option>
      <option>Technology</option>
      <option>Sports</option>
      <option>Video</option>
    </select>

    <label>Short Description</label>
    <textarea id="editExcerpt"></textarea>

    <label>Article Image URL</label>
    <input id="editImage">

    <label>Article Body</label>
    <textarea id="editBody"></textarea>

    <label>Author</label>
    <input id="editAuthor">

    <button class="save" id="saveEdit">
      Save Changes
    </button>

    <button class="cancel" id="cancelEdit">
      Cancel
    </button>

  </section>


  <!-- ARTICLES -->
  <section class="card">

    <h2>Published Articles</h2>

    <div id="articlesList">
      Loading articles...
    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const ADMIN_ID =
  "280627ab-6dfb-4f45-ae11-b5fc14288eb5";


const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;

}


async function checkLogin() {

  const { data, error } =
    await db.auth.getSession();

  if (error || !data.session) {

    window.location.href = "/login.html";

    return false;
  }

  if (data.session.user.id !== ADMIN_ID) {

    await db.auth.signOut();

    window.location.href = "/login.html";

    return false;
  }

  return true;
}


async function loadArticles() {

  const { data, error } = await db
    .from("articles")
    .select("*")
    .order("published_at", {
      ascending: false
    });

  const list =
    document.getElementById("articlesList");

  if (error) {

    list.innerHTML =
      "<p>ERROR: " +
      error.message +
      "</p>";

    return;
  }

  if (!data || data.length === 0) {

    list.innerHTML =
      "<p>No articles found.</p>";

    return;
  }

  list.innerHTML = "";

  data.forEach(article => {

    const div =
      document.createElement("div");

    div.className = "article";

    div.innerHTML = `
      <h3>${escapeHtml(article.title)}</h3>

      <div class="meta">
        ${escapeHtml(article.category || "")}
        ·
        ${escapeHtml(article.author || "")}
      </div>

      <button class="edit-btn"
        onclick="editArticle('${article.id}')">
        Edit
      </button>

      <button class="delete-btn"
        onclick="deleteArticle('${article.id}')">
        Delete
      </button>
    `;

    list.appendChild(div);

  });

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function editArticle(id) {

  const { data, error } =
    await db
      .from("articles")
      .select("*")
      .eq("id", id)
      .single();

  if (error) {

    showMessage(
      "ERROR: " + error.message,
      "error"
    );

    return;
  }

  document.getElementById("editId").value =
    data.id;

  document.getElementById("editTitle").value =
    data.title || "";

  document.getElementById("editCategory").value =
    data.category || "UK";

  document.getElementById("editExcerpt").value =
    data.excerpt || "";

  document.getElementById("editImage").value =
    data.image_url || "";

  document.getElementById("editBody").value =
    data.body || "";

  document.getElementById("editAuthor").value =
    data.author || "Marian";

  document.getElementById("editCard").style.display =
    "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


document.getElementById("saveEdit")
.addEventListener("click", async () => {

  const id =
    document.getElementById("editId").value;

  const updates = {

    title:
      document.getElementById("editTitle").value.trim(),

    category:
      document.getElementById("editCategory").value,

    excerpt:
      document.getElementById("editExcerpt").value.trim(),

    image_url:
      document.getElementById("editImage").value.trim(),

    body:
      document.getElementById("editBody").value.trim(),

    author:
      document.getElementById("editAuthor").value.trim()

  };


  const { error } = await db
    .from("articles")
    .update(updates)
    .eq("id", id);


  if (error) {

    showMessage(
      "ERROR: " + error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Article updated successfully!",
    "success"
  );


  document.getElementById("editCard").style.display =
    "none";

  loadArticles();

});


document.getElementById("cancelEdit")
.addEventListener("click", () => {

  document.getElementById("editCard").style.display =
    "none";

});


async function deleteArticle(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this article?"
    );

  if (!confirmed) return;


  const { error } = await db
    .from("articles")
    .delete()
    .eq("id", id);


  if (error) {

    showMessage(
      "ERROR: " + error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Article deleted successfully!",
    "success"
  );


  loadArticles();

}


document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await db.auth.signOut();

  window.location.href =
    "/login.html";

});


document.getElementById("articleForm")
.addEventListener("submit", async (e) => {

  e.preventDefault();


  const { data: sessionData } =
    await db.auth.getSession();


  if (
    !sessionData.session ||
    sessionData.session.user.id !== ADMIN_ID
  ) {

    window.location.href =
      "/login.html";

    return;
  }


  const title =
    document.getElementById("title")
      .value.trim();

  const category =
    document.getElementById("category")
      .value;

  const excerpt =
    document.getElementById("excerpt")
      .value.trim();

  const image_url =
    document.getElementById("image_url")
      .value.trim();

  const body =
    document.getElementById("body")
      .value.trim();

  const author =
    document.getElementById("author")
      .value.trim();


  const slug =
    title
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      +
      "-" +
      Date.now();


  const { error } =
    await db
      .from("articles")
      .insert({

        title,
        slug,
        excerpt,
        body,
        category,
        author,
        image_url: image_url || null,
        status: "published",
        published_at:
          new Date().toISOString()

      });


  if (error) {

    showMessage(
      "ERROR: " + error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Article published successfully!",
    "success"
  );


  document.getElementById("articleForm")
    .reset();

  document.getElementById("author").value =
    "Marian";


  loadArticles();

});


(async () => {

  const loggedIn =
    await checkLogin();

  if (loggedIn) {

    loadArticles();

  }

})();

</script>

</body>
</html>
