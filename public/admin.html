<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora News Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:22px}
header button{
  background:#dc2626;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:6px;
  cursor:pointer;
}
.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}
.card{
  background:white;
  padding:22px;
  border-radius:10px;
  margin-bottom:22px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
h2{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:6px;
  font-size:15px;
}
textarea{min-height:180px;resize:vertical}
.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
button{
  border:0;
  border-radius:6px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:bold;
}
.publish{background:#dc2626;color:white}
.draft{background:#374151;color:white}
.cancel{background:#e5e7eb;color:#111827}
.edit{background:#2563eb;color:white}
.delete{background:#b91c1c;color:white}
.status{
  margin-top:15px;
  padding:12px;
  border-radius:6px;
  display:none;
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.article{
  border:1px solid #e5e7eb;
  padding:16px;
  border-radius:8px;
  margin-top:12px;
}
.article h3{margin:0 0 8px}
.meta{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}
.article-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.thumb{
  width:100px;
  height:65px;
  object-fit:cover;
  border-radius:5px;
  margin-bottom:8px;
}
.preview{
  max-width:300px;
  max-height:200px;
  margin-top:10px;
  border-radius:8px;
  display:none;
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}
.badge-draft{background:#fef3c7;color:#92400e}
.badge-published{background:#dcfce7;color:#166534}
</style>
</head>

<body>

<header>
  <h1>NEXORA NEWS — Admin</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- NEW ARTICLE -->
  <div class="card">
    <h2>New Article</h2>

    <label>Headline</label>
    <input id="title" placeholder="Enter article headline">

    <label>Category</label>
    <select id="category">
      <option value="London">London</option>
      <option value="UK">UK</option>
      <option value="World">World</option>
      <option value="Business">Business</option>
      <option value="Technology">Technology</option>
      <option value="Sports">Sports</option>
      <option value="Video">Video</option>
    </select>

    <label>Short Description</label>
    <textarea id="excerpt" style="min-height:100px"
      placeholder="Short description of the article"></textarea>

    <label>Article Image</label>
    <input id="image_file" type="file" accept="image/*">
    <img id="imagePreview" class="preview">

    <label>Article Body</label>
    <textarea id="body"
      placeholder="Write the full article here..."></textarea>

    <label>Author</label>
    <input id="author" value="Marian">

    <div class="buttons">
      <button class="draft" onclick="saveDraft()">Save Draft</button>
      <button class="publish" onclick="publishArticle()">Publish Article</button>
    </div>

    <div id="newStatus" class="status"></div>
  </div>


  <!-- EDIT ARTICLE -->
  <div class="card" id="editCard" style="display:none">
    <h2>Edit Article</h2>

    <input type="hidden" id="editId">

    <label>Headline</label>
    <input id="editTitle">

    <label>Category</label>
    <select id="editCategory">
      <option value="London">London</option>
      <option value="UK">UK</option>
      <option value="World">World</option>
      <option value="Business">Business</option>
      <option value="Technology">Technology</option>
      <option value="Sports">Sports</option>
      <option value="Video">Video</option>
    </select>

    <label>Short Description</label>
    <textarea id="editExcerpt" style="min-height:100px"></textarea>

    <label>Replace Image</label>
    <input id="editImageFile" type="file" accept="image/*">
    <img id="editImagePreview" class="preview">

    <label>Article Body</label>
    <textarea id="editBody"></textarea>

    <label>Author</label>
    <input id="editAuthor">

    <div class="buttons">
      <button class="edit" onclick="saveEdit()">Save Changes</button>
      <button class="cancel" onclick="cancelEdit()">Cancel</button>
    </div>

    <div id="editStatus" class="status"></div>
  </div>


  <!-- ARTICLES -->
  <div class="card">
    <h2>Articles</h2>

    <div class="buttons">
      <button class="cancel" onclick="showPublished()">Published Articles</button>
      <button class="draft" onclick="showDrafts()">Draft Articles</button>
    </div>

    <div id="articlesList">Loading...</div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozV_Fma9NccJ";

const ADMIN_ID =
"280627ab-6dfb-4f45-ae11-b5fc14288eb5";

const BUCKET_NAME = "news-images";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* LOGIN CHECK */
async function checkLogin(){

  const {data:{session}} =
    await db.auth.getSession();

  if(!session){
    window.location.href="/login.html";
    return false;
  }

  if(session.user.id !== ADMIN_ID){
    await db.auth.signOut();
    window.location.href="/login.html";
    return false;
  }

  return true;
}


/* ESCAPE HTML */
function esc(value){

  if(value === null || value === undefined)
    return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* SLUG */
function makeSlug(title){

  return title
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-")
    + "-" + Date.now();
}


/* IMAGE PREVIEW */
document.getElementById("image_file")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const preview =
    document.getElementById("imagePreview");

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});


document.getElementById("editImageFile")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const preview =
    document.getElementById("editImagePreview");

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});


/* UPLOAD IMAGE */
async function uploadImage(file){

  if(!file)return null;

  if(!file.type.startsWith("image/")){
    throw new Error("Please select an image file.");
  }

  if(file.size > 10 * 1024 * 1024){
    throw new Error("Image must be less than 10MB.");
  }

  const cleanName =
    file.name.replace(/[^a-zA-Z0-9.-]/g,"-");

  const path =
    ADMIN_ID + "/" +
    Date.now() + "-" +
    cleanName;

  const {error} =
    await db.storage
      .from(BUCKET_NAME)
      .upload(path,file,{
        cacheControl:"3600",
        upsert:false
      });

  if(error) throw error;

  const {data} =
    db.storage
      .from(BUCKET_NAME)
      .getPublicUrl(path);

  return data.publicUrl;
}


/* FORM DATA */
function getFormData(){

  return {
    title:document.getElementById("title").value.trim(),
    category:document.getElementById("category").value,
    excerpt:document.getElementById("excerpt").value.trim(),
    body:document.getElementById("body").value.trim(),
    author:document.getElementById("author").value.trim() || "Marian"
  };
}


/* MESSAGE */
function message(id,text,type){

  const box=document.getElementById(id);

  box.textContent=text;
  box.className="status "+type;
  box.style.display="block";
}


/* SAVE DRAFT */
async function saveDraft(){

  try{

    const ok=await checkLogin();

    if(!ok)return;

    const form=getFormData();

    if(!form.title || !form.body){

      message(
        "newStatus",
        "Headline and Article Body are required.",
        "error"
      );

      return;
    }

    message(
      "newStatus",
      "Saving draft...",
      "success"
    );

    const file =
      document.getElementById("image_file").files[0];

    let imageUrl=null;

    if(file){
      imageUrl=await uploadImage(file);
    }

    const {error}=await db
      .from("articles")
      .insert([{
        title:form.title,
        slug:makeSlug(form.title),
        excerpt:form.excerpt,
        body:form.body,
        category:form.category,
        author:form.author,
        image_url:imageUrl,
        status:"draft",
        published_at:null
      }]);

    if(error)throw error;

    message(
      "newStatus",
      "Draft saved successfully!",
      "success"
    );

    clearNewForm();
    loadArticles();

  }catch(error){

    message(
      "newStatus",
      "ERROR: "+error.message,
      "error"
    );

  }

}


/* PUBLISH */
async function publishArticle(){

  try{

    const ok=await checkLogin();

    if(!ok)return;

    const form=getFormData();

    if(!form.title || !form.body){

      message(
        "newStatus",
        "Headline and Article Body are required.",
        "error"
      );

      return;
    }

    message(
      "newStatus",
      "Publishing article...",
      "success"
    );

    const file =
      document.getElementById("image_file").files[0];

    let imageUrl=null;

    if(file){
      imageUrl=await uploadImage(file);
    }

    const {error}=await db
      .from("articles")
      .insert([{
        title:form.title,
        slug:makeSlug(form.title),
        excerpt:form.excerpt,
        body:form.body,
        category:form.category,
        author:form.author,
        image_url:imageUrl,
        status:"published",
        published_at:new Date().toISOString()
      }]);

    if(error)throw error;

    message(
      "newStatus",
      "Article published successfully!",
      "success"
    );

    clearNewForm();
    loadArticles();

  }catch(error){

    message(
      "newStatus",
      "ERROR: "+error.message,
      "error"
    );

  }

}


/* CLEAR NEW FORM */
function clearNewForm(){

  document.getElementById("title").value="";
  document.getElementById("excerpt").value="";
  document.getElementById("body").value="";
  document.getElementById("image_file").value="";

  document.getElementById("imagePreview").style.display="none";

}


/* LOAD ARTICLES */
async function loadArticles(mode="all"){

  const ok=await checkLogin();

  if(!ok)return;

  let query=db
    .from("articles")
    .select("*")
    .order("created_at",{ascending:false});

  if(mode==="published"){
    query=query.eq("status","published");
  }

  if(mode==="draft"){
    query=query.eq("status","draft");
  }

  const {data,error}=await query;

  const list=
    document.getElementById("articlesList");

  if(error){

    list.innerHTML=
      "<p>ERROR: "+esc(error.message)+"</p>";

    return;
  }

  if(!data || data.length===0){

    list.innerHTML="<p>No articles found.</p>";

    return;
  }

  list.innerHTML=data.map(article=>{

    const badge =
      article.status==="draft"
      ? `<span class="badge badge-draft">DRAFT</span>`
      : `<span class="badge badge-published">PUBLISHED</span>`;

    const image =
      article.image_url
      ? `<img class="thumb" src="${esc(article.image_url)}">`
      : "";

    return `
      <div class="article">

        ${image}

        <h3>${esc(article.title)}</h3>

        <div class="meta">
          ${esc(article.category)}
          · ${esc(article.author)}
          · ${badge}
        </div>

        <div>
          ${esc(article.excerpt || "")}
        </div>

        <div class="article-buttons">

          <button
            class="edit"
            onclick="editArticle('${article.id}')">
            Edit
          </button>

          <button
            class="delete"
            onclick="deleteArticle('${article.id}')">
            Delete
          </button>

        </div>

      </div>
    `;

  }).join("");

}


/* PUBLISHED */
function showPublished(){
  loadArticles("published");
}


/* DRAFTS */
function showDrafts(){
  loadArticles("draft");
}


/* EDIT */
async function editArticle(id){

  const {data,error}=await db
    .from("articles")
    .select("*")
    .eq("id",id)
    .single();

  if(error){

    alert(error.message);
    return;
  }

  document.getElementById("editCard")
    .style.display="block";

  document.getElementById("editId").value=data.id;
  document.getElementById("editTitle").value=data.title;
  document.getElementById("editCategory").value=data.category;
  document.getElementById("editExcerpt").value=data.excerpt || "";
  document.getElementById("editBody").value=data.body;
  document.getElementById("editAuthor").value=data.author || "Marian";

  document.getElementById("editImageFile").value="";

  const preview=
    document.getElementById("editImagePreview");

  if(data.image_url){

    preview.src=data.image_url;
    preview.style.display="block";

  }else{

    preview.style.display="none";

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* SAVE EDIT */
async function saveEdit(){

  try{

    const ok=await checkLogin();

    if(!ok)return;

    const id=
      document.getElementById("editId").value;

    let imageUrl=null;

    const file=
      document.getElementById("editImageFile").files[0];

    if(file){
      imageUrl=await uploadImage(file);
    }

    const updateData={

      title:
        document.getElementById("editTitle").value.trim(),

      category:
        document.getElementById("editCategory").value,

      excerpt:
        document.getElementById("editExcerpt").value.trim(),

      body:
        document.getElementById("editBody").value.trim(),

      author:
        document.getElementById("editAuthor").value.trim() || "Marian"

    };

    if(imageUrl){
      updateData.image_url=imageUrl;
    }

    const {error}=await db
      .from("articles")
      .update(updateData)
      .eq("id",id);

    if(error)throw error;

    message(
      "editStatus",
      "Article updated successfully!",
      "success"
    );

    loadArticles();

  }catch(error){

    message(
      "editStatus",
      "ERROR: "+error.message,
      "error"
    );

  }

}


/* CANCEL EDIT */
function cancelEdit(){

  document.getElementById("editCard")
    .style.display="none";

}


/* DELETE */
async function deleteArticle(id){

  if(!confirm(
    "Are you sure you want to delete this article?"
  )) return;

  const ok=await checkLogin();

  if(!ok)return;

  const {error}=await db
    .from("articles")
    .delete()
    .eq("id",id);

  if(error){

    alert("ERROR: "+error.message);
    return;
  }

  alert("Article deleted successfully.");

  loadArticles();

}


/* LOGOUT */
async function logout(){

  await db.auth.signOut();

  window.location.href="/login.html";

}


/* START */
checkLogin().then(ok=>{

  if(ok){
    loadArticles();
  }

});

</script>

</body>
</html>
