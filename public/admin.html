<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora News — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827
}

header{
background:#111827;
color:white;
padding:18px 22px;
display:flex;
justify-content:space-between;
align-items:center
}

header h1{
margin:0;
font-size:21px
}

button{cursor:pointer}

.logout{
background:#dc2626;
color:white;
border:0;
padding:10px 15px;
border-radius:6px
}

main{
max-width:1100px;
margin:25px auto;
padding:0 15px
}

.card{
background:white;
padding:24px;
margin-bottom:25px;
border-radius:12px;
box-shadow:0 3px 14px rgba(0,0,0,.08)
}

h2{margin-top:0}

label{
display:block;
font-weight:bold;
margin:16px 0 7px
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:7px;
font-size:15px
}

textarea{
min-height:160px;
resize:vertical
}

input[type=file]{
background:#f9fafb
}

.preview{
display:none;
width:100%;
max-height:320px;
object-fit:cover;
margin-top:12px;
border-radius:8px;
border:1px solid #e5e7eb
}

.publish,.save,.cancel,.draft-publish{
margin-top:20px;
padding:13px 18px;
border:0;
border-radius:7px;
color:white;
font-weight:bold
}

.publish{
background:#b91c1c;
width:100%
}

.save{
background:#2563eb
}

.draft-publish{
background:#16a34a
}

.cancel{
margin-left:8px;
background:#6b7280
}

.article{
border:1px solid #e5e7eb;
border-radius:9px;
padding:15px;
margin-top:14px
}

.article h3{
margin:0 0 7px
}

.meta{
color:#6b7280;
font-size:13px;
margin-bottom:12px
}

.status{
display:inline-block;
padding:4px 8px;
border-radius:5px;
font-size:12px;
font-weight:bold;
margin-bottom:10px
}

.status-published{
background:#dcfce7;
color:#166534
}

.status-draft{
background:#fef3c7;
color:#92400e
}

.article-thumb{
width:100%;
max-width:420px;
max-height:230px;
object-fit:cover;
border-radius:8px;
margin:8px 0 12px
}

.edit-btn{
background:#2563eb;
color:white;
border:0;
padding:9px 14px;
border-radius:6px
}

.delete-btn{
background:#dc2626;
color:white;
border:0;
padding:9px 14px;
border-radius:6px;
margin-left:6px
}

#message{
display:none;
margin-top:15px;
padding:12px;
border-radius:7px
}

.success{
display:block!important;
background:#dcfce7;
color:#166534
}

.error{
display:block!important;
background:#fee2e2;
color:#991b1b
}

.info{
display:block!important;
background:#dbeafe;
color:#1e40af
}

#editCard{
display:none
}

@media(max-width:600px){
header h1{font-size:17px}
.card{padding:18px}
}
</style>
</head>

<body>

<header>
<h1>NEXORA NEWS — ADMIN</h1>
<button class="logout" id="logoutBtn">Logout</button>
</header>

<main>

<section class="card">

<h2>Publish New Article</h2>

<form id="articleForm">

<label>Headline</label>
<input id="title" required>

<label>Category</label>

<select id="category" required>

<option value="">Select category</option>

<option>London</option>
<option>UK</option>
<option>World</option>
<option>Business</option>
<option>Technology</option>
<option>Sports</option>
<option>Video</option>

</select>

<label>Short Description</label>

<textarea id="excerpt" required></textarea>

<label>Article Image</label>

<input id="image_file" type="file" accept="image/*">

<img id="imagePreview"
class="preview"
alt="Image preview">

<label>Article Body</label>

<textarea id="body" required></textarea>

<label>Author</label>

<input id="author"
value="Marian"
required>

<button
class="publish"
id="publishBtn"
type="submit">

Publish Article

</button>

<button
class="save"
id="saveDraftBtn"
type="button">

Save Draft

</button>

</form>

<div id="message"></div>

</section>


<section class="card" id="editCard">

<h2>Edit Article</h2>

<input type="hidden" id="editId">

<label>Headline</label>
<input id="editTitle">

<label>Category</label>

<select id="editCategory">

<option>London</option>
<option>UK</option>
<option>World</option>
<option>Business</option>
<option>Technology</option>
<option>Sports</option>
<option>Video</option>

</select>

<label>Short Description</label>

<textarea id="editExcerpt"></textarea>

<label>Article Image</label>

<input
id="editImageFile"
type="file"
accept="image/*">

<img
id="editImagePreview"
class="preview"
alt="Current image">

<input type="hidden" id="editImage">

<label>Article Body</label>

<textarea id="editBody"></textarea>

<label>Author</label>

<input id="editAuthor">

<button
class="save"
id="saveEdit">

Save Changes

</button>

<button
class="cancel"
id="cancelEdit">

Cancel

</button>

</section>


<section class="card">

<h2>Draft Articles</h2>

<div id="draftsList">
Loading drafts...
</div>

</section>


<section class="card">

<h2>Published Articles</h2>

<div id="articlesList">
Loading articles...
</div>

</section>

</main>


<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const ADMIN_ID =
"280627ab-6dfb-4f45-ae11-b5fc14288eb5";

const BUCKET_NAME =
"news-images";

const message =
document.getElementById("message");


function showMessage(text,type){

message.textContent=text;
message.className=type;

}


function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function checkLogin(){

const {data,error} =
await db.auth.getSession();

if(error || !data.session){

window.location.href="/login.html";

return false;

}

if(
data.session.user.id !== ADMIN_ID
){

await db.auth.signOut();

window.location.href="/login.html";

return false;

}

return true;

}


/* IMAGE UPLOAD */

async function uploadImage(file){

if(!file) return null;

if(!file.type.startsWith("image/")){

throw new Error(
"Please select an image file."
);

}

if(file.size > 10*1024*1024){

throw new Error(
"Image is too large. Please use an image under 10 MB."
);

}

const cleanName =
file.name
.toLowerCase()
.replace(/[^a-z0-9.]+/g,"-");

const filePath =
ADMIN_ID +
"/" +
Date.now() +
"-" +
cleanName;

const {error} =
await db.storage
.from(BUCKET_NAME)
.upload(
filePath,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error) throw error;

const {data} =
db.storage
.from(BUCKET_NAME)
.getPublicUrl(filePath);

return data.publicUrl;

}


/* IMAGE PREVIEW */

document
.getElementById("image_file")
.addEventListener(
"change",
function(){

const file =
this.files[0];

const preview =
document.getElementById(
"imagePreview"
);

if(!file){

preview.style.display="none";

return;

}

preview.src =
URL.createObjectURL(file);

preview.style.display="block";

});


document
.getElementById("editImageFile")
.addEventListener(
"change",
function(){

const file =
this.files[0];

const preview =
document.getElementById(
"editImagePreview"
);

if(!file)return;

preview.src =
URL.createObjectURL(file);

preview.style.display="block";

});


/* LOAD ARTICLES */

async function loadArticles(){

const {data,error} =
await db
.from("articles")
.select("*")
.order(
"created_at",
{ascending:false}
);

const publishedList =
document.getElementById(
"articlesList"
);

const draftsList =
document.getElementById(
"draftsList"
);

if(error){

publishedList.innerHTML =
"<p>ERROR: "+
escapeHtml(error.message)+
"</p>";

draftsList.innerHTML =
"<p>ERROR: "+
escapeHtml(error.message)+
"</p>";

return;

}

const published =
(data||[]).filter(
article =>
article.status === "published"
);

const drafts =
(data||[]).filter(
article =>
article.status === "draft"
);

renderArticleList(
published,
publishedList,
false
);

renderArticleList(
drafts,
draftsList,
true
);

}


function renderArticleList(
items,
list,
isDraft
){

if(!items.length){

list.innerHTML =
isDraft
?
"<p>No draft articles.</p>"
:
"<p>No published articles.</p>";

return;

}

list.innerHTML="";

items.forEach(article => {

const div =
document.createElement("div");

div.className="article";

const image =
article.image_url
?
`<img
class="article-thumb"
src="${escapeHtml(article.image_url)}"
alt="Article image">`
:
"";

const statusClass =
isDraft
?
"status-draft"
:
"status-published";

const statusText =
isDraft
?
"DRAFT"
:
"PUBLISHED";

div.innerHTML = `

<div class="status ${statusClass}">
${statusText}
</div>

<h3>
${escapeHtml(article.title)}
</h3>

<div class="meta">
${escapeHtml(article.category||"")}
·
${escapeHtml(article.author||"")}
</div>

${image}

<button
class="edit-btn"
onclick="editArticle('${article.id}')">

Edit

</button>

${
isDraft
?
`
<button
class="draft-publish"
onclick="publishDraft('${article.id}')">

Publish

</button>
`
:
""
}

<button
class="delete-btn"
onclick="deleteArticle('${article.id}')">

Delete

</button>

`;

list.appendChild(div);

});

}


/* EDIT ARTICLE */

async function editArticle(id){

const {data,error} =
await db
.from("articles")
.select("*")
.eq("id",id)
.single();

if(error){

showMessage(
"ERROR: "+error.message,
"error"
);

return;

}

document.getElementById(
"editId"
).value=data.id;

document.getElementById(
"editTitle"
).value=data.title||"";

document.getElementById(
"editCategory"
).value=data.category||"UK";

document.getElementById(
"editExcerpt"
).value=data.excerpt||"";

document.getElementById(
"editImage"
).value=data.image_url||"";

document.getElementById(
"editBody"
).value=data.body||"";

document.getElementById(
"editAuthor"
).value=data.author||"Marian";

const preview =
document.getElementById(
"editImagePreview"
);

if(data.image_url){

preview.src=data.image_url;

preview.style.display="block";

}else{

preview.style.display="none";

}

document.getElementById(
"editCard"
).style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* SAVE EDIT */

document
.getElementById("saveEdit")
.addEventListener(
"click",
async function(){

const id =
document.getElementById(
"editId"
).value;

const button =
document.getElementById(
"saveEdit"
);

button.disabled=true;

button.textContent=
"Saving...";

try{

let imageUrl =
document.getElementById(
"editImage"
).value.trim();

const newImage =
document.getElementById(
"editImageFile"
).files[0];

if(newImage){

showMessage(
"Uploading new image...",
"info"
);

imageUrl =
await uploadImage(newImage);

}

const updates = {

title:
document.getElementById(
"editTitle"
).value.trim(),

category:
document.getElementById(
"editCategory"
).value,

excerpt:
document.getElementById(
"editExcerpt"
).value.trim(),

image_url:
imageUrl||null,

body:
document.getElementById(
"editBody"
).value.trim(),

author:
document.getElementById(
"editAuthor"
).value.trim()

};

const {error} =
await db
.from("articles")
.update(updates)
.eq("id",id);

if(error)throw error;

showMessage(
"Article updated successfully!",
"success"
);

document.getElementById(
"editCard"
).style.display="none";

loadArticles();

}catch(error){

showMessage(
"ERROR: "+error.message,
"error"
);

}finally{

button.disabled=false;

button.textContent=
"Save Changes";

}

});


document
.getElementById("cancelEdit")
.addEventListener(
"click",
function(){

document.getElementById(
"editCard"
).style.display="none";

});


/* DELETE */

async function deleteArticle(id){

const confirmed =
confirm(
"Are you sure you want to delete this article?"
);

if(!confirmed)return;

const {error} =
await db
.from("articles")
.delete()
.eq("id",id);

if(error){

showMessage(
"ERROR: "+error.message,
"error"
);

return;

}

showMessage(
"Article deleted successfully!",
"success"
);

loadArticles();

}


/* PUBLISH NEW ARTICLE */

document
.getElementById("articleForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const {data:sessionData} =
await db.auth.getSession();

if(
!sessionData.session ||
sessionData.session.user.id !== ADMIN_ID
){

window.location.href="/login.html";

return;

}

const button =
document.getElementById(
"publishBtn"
);

button.disabled=true;

button.textContent=
"Publishing...";

try{

const title =
document.getElementById(
"title"
).value.trim();

const category =
document.getElementById(
"category"
).value;

const excerpt =
document.getElementById(
"excerpt"
).value.trim();

const body =
document.getElementById(
"body"
).value.trim();

const author =
document.getElementById(
"author"
).value.trim();

const imageFile =
document.getElementById(
"image_file"
).files[0];

let imageUrl=null;

if(imageFile){

showMessage(
"Uploading image...",
"info"
);

imageUrl =
await uploadImage(imageFile);

}

const slug =
title
.toLowerCase()
.replace(
/[^a-z0-9]+/g,
"-"
)
.replace(
/^-+|-+$/g,
""
)
+
"-"
+
Date.now();

const {error} =
await db
.from("articles")
.insert({

title:title,

slug:slug,

excerpt:excerpt,

body:body,

category:category,

author:author,

image_url:imageUrl,

status:"published",

published_at:
new Date().toISOString()

});

if(error)throw error;

showMessage(
"Article published successfully!",
"success"
);

document
.getElementById(
"articleForm"
)
.reset();

document.getElementById(
"author"
).value="Marian";

document.getElementById(
"imagePreview"
).style.display="none";

loadArticles();

}catch(error){

showMessage(
"ERROR: "+error.message,
"error"
);

}finally{

button.disabled=false;

button.textContent=
"Publish Article";

}

});


/* SAVE DRAFT */

document
.getElementById("saveDraftBtn")
.addEventListener(
"click",
async function(){

const {data:sessionData} =
await db.auth.getSession();

if(
!sessionData.session ||
sessionData.session.user.id !== ADMIN_ID
){

window.location.href="/login.html";

return;

}

const button =
document.getElementById(
"saveDraftBtn"
);

button.disabled=true;

button.textContent=
"Saving Draft...";

try{

const title =
document.getElementById(
"title"
).value.trim();

const category =
document.getElementById(
"category"
).value;

const excerpt =
document.getElementById(
"excerpt"
).value.trim();

const body =
document.getElementById(
"body"
).value.trim();

const author =
document.getElementById(
"author"
).value.trim();

const imageFile =
document.getElementById(
"image_file"
).files[0];

if(!title){

throw new Error(
"Please enter a headline before saving the draft."
);

}

let imageUrl=null;

if(imageFile){

showMessage(
"Uploading draft image...",
"info"
);

imageUrl =
await uploadImage(imageFile);

}

const slug =
title
.toLowerCase()
.replace(
/[^a-z0-9]+/g,
"-"
)
.replace(
/^-+|-+$/g,
""
)
+
"-"
+
Date.now();

const {error} =
await db
.from("articles")
.insert({

title:title,

slug:slug,

excerpt:excerpt,

body:body,

category:
category||"UK",

author:
author||"Marian",

image_url:
imageUrl,

status:"draft",

published_at:null

});

if(error)throw error;

showMessage(
"Draft saved successfully!",
"success"
);

document
.getElementById(
"articleForm"
)
.reset();

document.getElementById(
"author"
).value="Marian";

document.getElementById(
"imagePreview"
).style.display="none";

loadArticles();

}catch(error){

showMessage(
"ERROR: "+error.message,
"error"
);

}finally{

button.disabled=false;

button.textContent=
"Save Draft";

}

});


/* PUBLISH DRAFT */

async function publishDraft(id){

const confirmed =
confirm(
"Publish this draft article?"
);

if(!confirmed)return;

const {error} =
await db
.from("articles")
.update({

status:"published",

published_at:
new Date().toISOString()

})
.eq("id",id);

if(error){

showMessage(
"ERROR: "+error.message,
"error"
);

return;

}

showMessage(
"Draft published successfully!",
"success"
);

loadArticles();

}


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

await db.auth.signOut();

window.location.href=
"/login.html";

});


/* START */

(async function(){

const loggedIn =
await checkLogin();

if(loggedIn){

loadArticles();

}

})();

</script>

</body>
</html>
