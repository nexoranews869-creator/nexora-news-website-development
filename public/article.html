<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora News — Article</title>

<meta
name="description"
content="Read the latest news and stories from Nexora News."
>

<meta name="author" content="Nexora News">

<meta
property="og:type"
content="article"
>

<meta
property="og:site_name"
content="Nexora News"
>

<meta
property="og:title"
content="Nexora News — Article"
>

<meta
property="og:description"
content="Read the latest news and stories from Nexora News."
>

<meta
property="og:image"
content="https://nexora-news-website-development-9ve.vercel.app/"
>

<meta
name="twitter:card"
content="summary_large_image"
>

<meta
name="twitter:title"
content="Nexora News — Article"
>

<meta
name="twitter:description"
content="Read the latest news and stories from Nexora News."
>

<meta
name="robots"
content="index, follow"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#111827;
}

header{
background:#111827;
color:white;
padding:18px 22px;
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.back{
color:white;
text-decoration:none;
font-size:14px;
}

main{
max-width:900px;
margin:35px auto;
padding:0 18px;
}

.category{
color:#b91c1c;
font-size:14px;
font-weight:bold;
text-transform:uppercase;
margin-bottom:12px;
}

h1{
font-size:44px;
line-height:1.1;
margin:0 0 15px;
}

.meta{
color:#6b7280;
font-size:14px;
margin-bottom:25px;
}

.hero{
width:100%;
max-height:520px;
object-fit:cover;
border-radius:10px;
margin-bottom:30px;
}

.article-body{
font-size:19px;
line-height:1.75;
white-space:pre-wrap;
}

.loading,
.error{
padding:30px;
text-align:center;
}

.error{
color:#b91c1c;
}

@media(max-width:600px){

h1{
font-size:31px;
}

.article-body{
font-size:17px;
}

.logo{
font-size:18px;
}

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
NEXORA NEWS
</div>

<a class="back" href="/">
← Back to Home
</a>

</div>

</header>

<main id="article">

<div class="loading">
Loading article...
</div>

</main>

<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function getSlug(){

const params =
new URLSearchParams(
window.location.search
);

return params.get("slug");

}


async function loadArticle(){

const slug = getSlug();

const container =
document.getElementById("article");


if(!slug){

container.innerHTML = `
<div class="error">
Article not found.
</div>
`;

return;

}


const {data,error} =
await db
.from("articles")
.select("*")
.eq("slug",slug)
.eq("status","published")
.single();


if(error || !data){

container.innerHTML = `
<div class="error">
Article not found.
</div>
`;

return;

}


const date =
data.published_at
? new Date(data.published_at)
.toLocaleDateString(
"en-GB",
{
day:"numeric",
month:"long",
year:"numeric"
}
)
: "";


/* DYNAMIC SEO */

document.title =
data.title +
" | Nexora News";


const description =
data.excerpt ||
data.body ||
"Read the latest news from Nexora News.";


const existingDescription =
document.querySelector(
'meta[name="description"]'
);

if(existingDescription){

existingDescription.setAttribute(
"content",
description
);

}


const canonicalUrl =
window.location.href;


let canonical =
document.querySelector(
'link[rel="canonical"]'
);


if(!canonical){

canonical =
document.createElement("link");

canonical.rel="canonical";

document.head.appendChild(
canonical
);

}

canonical.href =
canonicalUrl;


/* OPEN GRAPH */

const ogTitle =
document.querySelector(
'meta[property="og:title"]'
);

const ogDescription =
document.querySelector(
'meta[property="og:description"]'
);

const ogImage =
document.querySelector(
'meta[property="og:image"]'
);


if(ogTitle){

ogTitle.setAttribute(
"content",
data.title
);

}

if(ogDescription){

ogDescription.setAttribute(
"content",
description
);

}


if(ogImage && data.image_url){

ogImage.setAttribute(
"content",
data.image_url
);

}


/* TWITTER */

const twitterTitle =
document.querySelector(
'meta[name="twitter:title"]'
);

const twitterDescription =
document.querySelector(
'meta[name="twitter:description"]'
);


if(twitterTitle){

twitterTitle.setAttribute(
"content",
data.title
);

}

if(twitterDescription){

twitterDescription.setAttribute(
"content",
description
);

}


const twitterImage =
document.querySelector(
'meta[name="twitter:image"]'
);


if(twitterImage && data.image_url){

twitterImage.setAttribute(
"content",
data.image_url
);

}


/* ARTICLE IMAGE */

const image =
data.image_url
? `
<img
class="hero"
src="${escapeHtml(data.image_url)}"
alt="${escapeHtml(data.title)}"
>
`
: "";


/* ARTICLE CONTENT */

container.innerHTML = `

<div class="category">
${escapeHtml(data.category)}
</div>

<h1>
${escapeHtml(data.title)}
</h1>

<div class="meta">
By ${escapeHtml(data.author || "Marian")}
${date ? " · " + date : ""}
</div>

${image}

<div class="article-body">
${escapeHtml(data.body)}
</div>

`;

}


loadArticle();

</script>

</body>
</html>
