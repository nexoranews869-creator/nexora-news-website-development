.breaking:hover .ticker span,

}

@keyframes tickerMove{

  100%{ transform:translateX(-100%); }

<script>

/* SUPABASE */

const SUPABASE_URL =

/* ESCAPE HTML */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SLUG (used only for old links) */

function makeSlug(title){

  return String(title || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}


/* ARTICLE URL: uses the stored slug */

function articleUrl(article){

  return "article.html?slug=" +
    encodeURIComponent(
      article.slug || makeSlug(article.title)
    );

}


/* DATE */

function formatDate(date){

  if(!date){
    return "";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );

}


/* SHARE */

function shareText(){
  return document.title;

/* SEO HELPERS */

function setMeta(selector,attr,value){

  const el = document.querySelector(selector);

  if(el && value){
    el.setAttribute(attr,value);
  }

}

function updateSEO(article){

  const title =
    article.title + " | Nexora News";

  const description =
    article.excerpt ||
    "Read the latest news and stories from Nexora News.";

  const canonical =
    window.location.origin +
    window.location.pathname +
    "?slug=" +
    encodeURIComponent(
      article.slug || makeSlug(article.title)
    );

  const image =
    article.image_url || DEFAULT_IMAGE;

  document.title = title;

  setMeta('meta[name="description"]','content',description);
  setMeta('link[rel="canonical"]','href',canonical);

  setMeta('meta[property="og:title"]','content',title);
  setMeta('meta[property="og:description"]','content',description);
  setMeta('meta[property="og:url"]','content',canonical);
  setMeta('meta[property="og:image"]','content',image);

  setMeta('meta[name="twitter:title"]','content',title);
  setMeta('meta[name="twitter:description"]','content',description);
  setMeta('meta[name="twitter:image"]','content',image);

  const published =
    article.published_at || article.created_at;

  const schema =
    document.getElementById("articleSchema");

  if(schema){

    schema.textContent =
      JSON.stringify({

        "@context":"https://schema.org",
        "@type":"NewsArticle",
        "headline":article.title,
        "description":description,
        "image":[image],
        "datePublished":published,
        "dateModified":article.updated_at || published,

        "author":{
          "@type":"Person",
          "name":article.author || "Nexora News"
        },

        "publisher":{
          "@type":"Organization",
          "name":"Nexora News"
        },

        "mainEntityOfPage":{
          "@type":"WebPage",
          "@id":canonical
        }

      });

  }

  /* Language of the article (needs a "language" column: ha, so, en) */

  const lang =
    String(article.language || article.lang || "")
      .toLowerCase();

  if(/^[a-z]{2,3}$/.test(lang)){
    document.documentElement.lang = lang;
  }

}


/* CLEAN ARTICLE BODY */

let purifyReady = false;

function initPurify(){

  if(purifyReady || !window.DOMPurify){
    return;
  }

  /* Only allow video embeds from trusted sites */

  DOMPurify.addHook(
    "afterSanitizeAttributes",
    node => {

      if(node.tagName === "IFRAME"){

        const src =
          node.getAttribute("src") || "";

        const ok =
          /^https:\/\/(www\.)?(youtube\.com|youtube-nocookie\.com|player\.vimeo\.com)\//
            .test(src);

        if(!ok){
          node.remove();
        }

      }

    }
  );

  purifyReady = true;

}

function renderBody(raw){

  const body = raw || "";

  const looksLikeHtml =
    /<\/?(p|h2|h3|h4|ul|ol|li|br|img|div|blockquote|iframe|a|strong|em)\b/i
      .test(body);

  if(looksLikeHtml && window.DOMPurify){

    initPurify();

    return DOMPurify.sanitize(
      body,
      {
        ADD_TAGS:["iframe"],
        ADD_ATTR:[
          "allow",
          "allowfullscreen",
          "frameborder",
          "loading"
        ]
      }
    );

  }

  /* plain text (or the cleaner failed to load): show as text */

  return body
    .split(/\n\s*\n/)
    .filter(p => p.trim())
    .map(p =>
      `<p>${esc(p).replace(/\n/g,"<br>")}</p>`
    )
    .join("");

}


/* SMALL QUERIES */

async function loadBreaking(){

  const { data, error } = await db
    .from("articles")
    .select("title")
    .eq("status","published")
    .eq("is_breaking",true)
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    })
    .limit(5);

  if(error || !data || !data.length){
    return;
  }

  document.getElementById("breaking").style.display = "block";

  document.getElementById("ticker").innerHTML =
    `<span>${esc(data.map(a => a.title).join("   •   "))}</span>`;

}

async function loadRelated(article){

  if(!article.category){
    return [];
  }

  const { data, error } = await db
    .from("articles")
    .select("id,title,slug,category,image_url")
    .eq("status","published")
    .eq("category",article.category)
    .neq("id",article.id)
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    })
    .limit(3);

  return error ? [] : (data || []);

}


/* FIND ARTICLE: by slug first, then by old title-based links */

async function findArticle(slug){

  const first = await db
    .from("articles")
    .select("*")
    .eq("status","published")
    .eq("slug",slug)
    .maybeSingle();

  if(first.error){
    return { error:first.error };
  }

  if(first.data){
    return { article:first.data };
  }

  /* Old links were built from the title */

  const list = await db
    .from("articles")
    .select("id,title")
    .eq("status","published")
    .limit(500);

  if(list.error){
    return { error:list.error };
  }

  const match =
    (list.data || []).find(item => {

      const titleSlug = makeSlug(item.title);

      return (
        titleSlug &&
        (
          slug === titleSlug ||
          slug.startsWith(titleSlug + "-")
        )
      );

    });

  if(!match){
    return { article:null };
  }

  const full = await db
    .from("articles")
    .select("*")
    .eq("id",match.id)
    .maybeSingle();

  if(full.error){
    return { error:full.error };
  }

  return { article:full.data };

}


/* MESSAGES */

function showError(title,text){

  document.getElementById("articleContainer").innerHTML = `

    <div class="error">

      <h1>${esc(title)}</h1>

      <p>${esc(text)}</p>

      <a href="/">Back to home</a>

    </div>

  `;

}


/* LOAD ARTICLE */

async function loadArticle(){

  const container =
    document.getElementById("articleContainer");

  const slug =
    new URLSearchParams(window.location.search)
      .get("slug");

  if(!slug){
    showError(
      "Article not found",
      "No article was selected."
    );
    return;
  }

  if(!window.supabase){
    showError(
      "Unable to load article",
      "Check your connection and refresh the page."
    );
    return;
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const result = await findArticle(slug);

  if(result.error){
    console.error(result.error);
    showError(
      "Unable to load article",
      "Please try again in a moment."
    );
    return;
  }

  const article = result.article;

  if(!article){
    showError(
      "Article not found",
      "The article may have been removed or the link may be incorrect."
    );
    return;
  }

  updateSEO(article);

  loadBreaking();

  const related =
    await loadRelated(article);

  const body =
    renderBody(article.body);

  const image =
    article.image_url
      ? `<img
          class="hero-image"
          src="${esc(article.image_url)}"
          alt="${esc(article.title)}"
          width="900"
          height="500"
          fetchpriority="high"
          decoding="async"
          onerror="this.style.display='none'"
        >`
      : "";

  const breakingBadge =
    article.is_breaking === true
      ? '<span class="breaking-badge">BREAKING NEWS</span>'
      : "";

  const relatedHTML =
    related.length
      ? `

        <section class="related">

          <h2>Related stories</h2>

          <div class="related-grid">

            ${related.map(item => `

              <a class="related-card" href="${articleUrl(item)}">

                ${
                  item.image_url
                  ? `<img
                      src="${esc(item.image_url)}"
                      alt="${esc(item.title)}"
                      width="300"
                      height="160"
                      loading="lazy"
                      decoding="async"
                      onerror="this.style.display='none'"
                    >`
                  : ""
                }

                <div class="related-content">

                  <div class="related-category">
                    ${esc(item.category || "News")}
                  </div>

                  <div class="related-title">
                    ${esc(item.title)}
                  </div>

                </div>

              </a>

            `).join("")}

          </div>

        </section>

      `
      : "";

  const dateValue =
    article.published_at || article.created_at || "";

  container.innerHTML = `

    <article class="article-card">

      <div>

        <span class="category">
          ${esc(article.category || "News")}
        </span>

        ${breakingBadge}

      </div>

      <h1 class="article-title">
        ${esc(article.title)}
      </h1>

      ${
        article.excerpt
        ? `<div class="article-excerpt">${esc(article.excerpt)}</div>`
        : ""
      }

      <div class="article-meta">

        By <strong>${esc(article.author || "Nexora News")}</strong>

        ${
          formatDate(dateValue)
          ? `&nbsp;•&nbsp;
             <time datetime="${esc(dateValue)}">
               ${esc(formatDate(dateValue))}
             </time>`
          : ""
        }

      </div>

      ${image}

      <div class="article-body">
        ${body}
      </div>

      <div class="share-box">

        <h2>Share this story</h2>

        <div class="share-buttons">

          <button
            type="button"
            class="native"
            id="nativeShareBtn"
            hidden
            onclick="nativeShare()"
          >
            Share
          </button>

          <button type="button" class="whatsapp" onclick="shareArticle()">
            WhatsApp
          </button>

          <button type="button" class="facebook" onclick="shareFacebook()">
            Facebook
          </button>

          <button type="button" class="x" onclick="shareX()">
            X
          </button>

          <button type="button" class="copy" onclick="copyLink()">
            Copy link
          </button>

        </div>

        <p class="share-status" id="shareStatus" role="status"></p>

      </div>

    </article>

    ${relatedHTML}

  `;

  /* Show the phone's own share sheet when available */

  if(navigator.share){
    const btn =
      document.getElementById("nativeShareBtn");

    if(btn){
      btn.hidden = false;
    }
  }

}


/* THEME TOGGLE */

function initTheme(){

  document
    .getElementById("themeToggle")
    .addEventListener("click",() => {

      const root = document.documentElement;

      const current =
        root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      const next =
        current === "dark" ? "light" : "dark";

      root.setAttribute("data-theme",next);

      try{
        localStorage.setItem("theme",next);
      }catch(e){}

    });

}


initTheme();
loadArticle();
