<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora News — Article</title>

<meta name="description"
content="Read the latest news and stories from Nexora News.">

<meta name="author" content="Nexora News">
<meta name="robots" content="index, follow">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Nexora News">

<meta property="og:title" content="Nexora News — Article">
<meta property="og:description"
content="Read the latest news and stories from Nexora News.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nexora News — Article">
<meta name="twitter:description"
content="Read the latest news and stories from Nexora News.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#111827;
}

header{
background:#111827;
color:white;
padding:18px 22px;
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.back{
color:white;
text-decoration:none;
font-size:14px;
}

main{
max-width:900px;
margin:35px auto;
padding:0 18px;
}

.category{
color:#b91c1c;
font-size:14px;
font-weight:bold;
text-transform:uppercase;
margin-bottom:12px;
}

h1{
font-size:44px;
line-height:1.1;
margin:0 0 15px;
}

.meta{
color:#6b7280;
font-size:14px;
margin-bottom:25px;
}

.hero{
width:100%;
max-height:520px;
object-fit:cover;
border-radius:10px;
margin-bottom:30px;
}

.article-body{
font-size:19px;
line-height:1.75;
white-space:pre-wrap;
}

.loading,
.error{
padding:30px;
text-align:center;
}

.error{
color:#b91c1c;
}

@media(max-width:600px){

h1{
font-size:31px;
}

.article-body{
font-size:17px;
}

.logo{
font-size:18px;
}

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
NEXORA NEWS
</div>

<a class="back" href="/">
← Back to Home
</a>

</div>

</header>

<main id="article">

<div class="loading">
Loading article...
</div>

</main>

<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* HTML SECURITY */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* CREATE SLUG */

function makeSlug(title){

return String(title || "")
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}


/* GET SLUG FROM URL */

function getSlug(){

const params =
new URLSearchParams(
window.location.search
);

return decodeURIComponent(
params.get("slug") || ""
)
.trim()
.toLowerCase();

}


/* LOAD ARTICLE */

async function loadArticle(){

const container =
document.getElementById("article");

const slug =
getSlug();


if(!slug){

container.innerHTML = `

<div class="error">

<h2>Article not found</h2>

</div>

`;

return;

}


/*
GET PUBLISHED ARTICLES
*/

const {data,error} =
await db
.from("articles")
.select("*")
.eq("status","published")
.order("published_at",{ascending:false});


/* DATABASE ERROR */

if(error){

console.error(
"Supabase article error:",
error
);

container.innerHTML = `

<div class="error">

<h2>Unable to load article</h2>

<p>
${escapeHtml(error.message)}
</p>

</div>

`;

return;

}


/* NO ARTICLES */

if(!data || data.length === 0){

container.innerHTML = `

<div class="error">

<h2>Article not found</h2>

<p>No published articles were found.</p>

</div>

`;

return;

}


/*
FIND ARTICLE

IMPORTANT:
The homepage may create URLs such as:

nexora-news-sabon-labari-1790609778089

while the article title creates:

nexora-news-sabon-labari

So we accept both formats.
*/

const article =
data.find(item => {

const titleSlug =
makeSlug(item.title);

return (
slug === titleSlug ||
slug.startsWith(titleSlug + "-")
);

});


/* ARTICLE NOT FOUND */

if(!article){

container.innerHTML = `

<div class="error">

<h2>Article not found</h2>

<p>
Slug: ${escapeHtml(slug)}
</p>

</div>

`;

return;

}


/* DATE */

const date =
article.published_at
? new Date(
article.published_at
).toLocaleDateString(
"en-GB",
{
day:"numeric",
month:"long",
year:"numeric"
}
)
: "";


/* DESCRIPTION */

const description =
article.excerpt ||
article.content ||
"Read the latest news from Nexora News.";


/* PAGE TITLE */

document.title =
article.title +
" | Nexora News";


/* META DESCRIPTION */

const metaDescription =
document.querySelector(
'meta[name="description"]'
);

if(metaDescription){

metaDescription.setAttribute(
"content",
description
);

}


/* CANONICAL */

let canonical =
document.querySelector(
'link[rel="canonical"]'
);

if(!canonical){

canonical =
document.createElement("link");

canonical.rel =
"canonical";

document.head.appendChild(
canonical
);

}

canonical.href =
window.location.href;


/* OPEN GRAPH TITLE */

let ogTitle =
document.querySelector(
'meta[property="og:title"]'
);

if(ogTitle){

ogTitle.setAttribute(
"content",
article.title
);

}


/* OPEN GRAPH DESCRIPTION */

let ogDescription =
document.querySelector(
'meta[property="og:description"]'
);

if(ogDescription){

ogDescription.setAttribute(
"content",
description
);

}


/* OPEN GRAPH IMAGE */

if(article.image_url){

let ogImage =
document.querySelector(
'meta[property="og:image"]'
);

if(!ogImage){

ogImage =
document.createElement("meta");

ogImage.setAttribute(
"property",
"og:image"
);

document.head.appendChild(
ogImage
);

}

ogImage.setAttribute(
"content",
article.image_url
);

}


/* TWITTER TITLE */

let twitterTitle =
document.querySelector(
'meta[name="twitter:title"]'
);

if(twitterTitle){

twitterTitle.setAttribute(
"content",
article.title
);

}


/* TWITTER DESCRIPTION */

let twitterDescription =
document.querySelector(
'meta[name="twitter:description"]'
);

if(twitterDescription){

twitterDescription.setAttribute(
"content",
description
);

}


/* TWITTER IMAGE */

if(article.image_url){

let twitterImage =
document.querySelector(
'meta[name="twitter:image"]'
);

if(!twitterImage){

twitterImage =
document.createElement("meta");

twitterImage.setAttribute(
"name",
"twitter:image"
);

document.head.appendChild(
twitterImage
);

}

twitterImage.setAttribute(
"content",
article.image_url
);

}


/* ARTICLE IMAGE */

const image =
article.image_url
? `

<img
class="hero"
src="${escapeHtml(article.image_url)}"
alt="${escapeHtml(article.title)}"
>

`
: "";


/* DISPLAY ARTICLE */

container.innerHTML = `

<div class="category">

${escapeHtml(article.category)}

</div>

<h1>

${escapeHtml(article.title)}

</h1>

<div class="meta">

By ${escapeHtml(
article.author || "Marian"
)}

${date ? " · " + date : ""}

</div>

${image}

<div class="article-body">

${escapeHtml(article.content)}

</div>

`;

}


/* START */

loadArticle();

</script>

</body>
</html>
