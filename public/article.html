<style>

:root{
  --bg:#f2f4f8;
  --surface:#ffffff;
  --soft:#e8ecf3;
  --text:#0d1220;
  --body-text:#1c2334;
  --muted:#586279;
  --line:#e0e5ee;
  --red:#d0102a;
  --accent-text:#c60f28;
  --ink:#0b1020;
  --on-ink:#f4f6fb;
  --glass:rgba(242,244,248,.82);
  --shadow:0 1px 2px rgba(13,18,32,.05),0 8px 24px rgba(13,18,32,.06);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080b12;
    --surface:#121724;
    --soft:#1b2233;
    --text:#eef1f8;
    --body-text:#dde2ee;
    --muted:#a2acc3;
    --line:#222b3f;
    --accent-text:#ff6f82;
    --ink:#04060b;
    --glass:rgba(8,11,18,.82);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}

:root[data-theme="dark"]{
  --bg:#080b12;
  --surface:#121724;
  --soft:#1b2233;
  --text:#eef1f8;
  --body-text:#dde2ee;
  --muted:#a2acc3;
  --line:#222b3f;
  --accent-text:#ff6f82;
  --ink:#04060b;
  --glass:rgba(8,11,18,.82);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

a:focus-visible,
button:focus-visible{
  outline:3px solid #ffbf47;
  outline-offset:2px;
  border-radius:8px;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.skip-link{
  position:absolute;
  left:-999px;
  top:0;
  background:#ffbf47;
  color:#111;
  padding:10px 14px;
  font-weight:700;
  z-index:2000;
}

.skip-link:focus{
  left:0;
}

/* READING PROGRESS */

.progress{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:3px;
  z-index:1100;
  background:var(--red);
  transform:scaleX(0);
  transform-origin:left;
}

/* HEADER */

.site-head{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}

.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:0 20px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  height:64px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--display);
  font-weight:800;
  font-size:24px;
  letter-spacing:-.03em;
}

.logo-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:800;
  letter-spacing:0;
  transform:rotate(-6deg);
}

.logo em{
  font-style:normal;
  color:var(--accent-text);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  font:600 14px/1 var(--font);
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}

.icon-btn:hover{
  background:var(--text);
  color:var(--surface);
  border-color:var(--text);
}

.icon-btn svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

nav{
  border-top:1px solid var(--line);
}

.nav-inner{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:9px 20px;
  max-width:1280px;
  margin:0 auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

nav a{
  flex-shrink:0;
  padding:8px 16px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  color:var(--muted);
  white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}

nav a:hover{
  background:var(--soft);
  color:var(--text);
}

/* BREAKING NEWS */

.breaking{
  display:none;
  margin-top:18px;
}

.breaking-inner{
  display:flex;
  align-items:center;
  background:var(--ink);
  color:var(--on-ink);
  border-radius:16px;
  overflow:hidden;
  min-height:48px;
}

.breaking-label{
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0;
  align-self:stretch;
  padding:0 18px;
  background:var(--red);
  color:#fff;
  font-weight:700;
  font-size:14px;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
  animation:pulse 1.6s ease-out infinite;
}

@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(255,255,255,.7); }
  100%{ box-shadow:0 0 0 10px rgba(255,255,255,0); }
}

.ticker{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  padding:13px 0;
  font-size:15px;
  font-weight:500;
}

.ticker span{
  display:inline-block;
  padding-left:100%;
  animation:tickerMove 30s linear infinite;
}

.breaking:hover .ticker span,
.breaking:focus-within .ticker span{
  animation-play-state:paused;
}

@keyframes tickerMove{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-100%); }
}

@media (prefers-reduced-motion: reduce){

  .ticker{
    overflow-x:auto;
  }

  .ticker span{
    animation:none;
    padding-left:14px;
  }

  .live-dot{
    animation:none;
  }

  html{
    scroll-behavior:auto;
  }

  *{
    transition:none !important;
  }

  .skeleton::after{
    animation:none !important;
  }

}

/* ARTICLE */

.article-container{
  max-width:1120px;
  margin:0 auto;
  padding:36px 20px 8px;
}

.article-card{
  max-width:1080px;
  margin:0 auto;
}

.article-head,
.article-body,
.share-box{
  max-width:760px;
  margin-left:auto;
  margin-right:auto;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.cat-chip{
  display:inline-block;
  background:var(--red);
  color:#fff;
  font-size:14px;
  font-weight:700;
  padding:6px 14px;
  border-radius:999px;
}

.breaking-badge{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:700;
  padding:6px 14px;
  border-radius:999px;
}

.article-title{
  font-family:var(--display);
  font-size:clamp(34px,5.4vw,60px);
  line-height:1.02;
  font-weight:800;
  letter-spacing:-.035em;
  margin-bottom:20px;
  text-wrap:balance;
}

.article-excerpt{
  font-size:clamp(19px,2.2vw,23px);
  color:var(--muted);
  line-height:1.5;
  margin-bottom:26px;
}

.article-meta{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 0;
  margin-bottom:28px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:15px;
}

.avatar{
  flex-shrink:0;
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--text);
  color:var(--surface);
  display:grid;
  place-items:center;
  font-family:var(--display);
  font-weight:800;
  font-size:18px;
}

.article-meta strong{
  display:block;
  color:var(--text);
  font-size:16px;
  line-height:1.25;
}

.hero-image{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:26px;
  margin-bottom:38px;
  background:var(--soft);
}

.article-body{
  font-size:20px;
  line-height:1.8;
  color:var(--body-text);
  overflow-wrap:anywhere;
}

.article-body p{
  margin-bottom:24px;
}

.article-body h2{
  font-family:var(--display);
  font-size:32px;
  line-height:1.15;
  letter-spacing:-.025em;
  color:var(--text);
  margin:44px 0 16px;
}

.article-body h3{
  font-family:var(--display);
  font-size:25px;
  line-height:1.2;
  letter-spacing:-.02em;
  color:var(--text);
  margin:34px 0 12px;
}

.article-body ul,
.article-body ol{
  margin:0 0 24px 26px;
}

.article-body li{
  margin-bottom:9px;
}

.article-body blockquote{
  border-left:4px solid var(--red);
  padding:6px 0 6px 22px;
  margin:32px 0;
  font-family:var(--display);
  font-size:26px;
  line-height:1.3;
  font-weight:600;
  letter-spacing:-.015em;
  color:var(--text);
}

.article-body img{
  max-width:100%;
  height:auto;
  display:block;
  margin:30px auto;
  border-radius:18px;
}

.article-body iframe{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  height:auto;
  border:0;
  margin:30px 0;
  border-radius:18px;
}

.article-body a{
  color:var(--accent-text);
  font-weight:600;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* SHARE */

.share-box{
  margin-top:44px;
  padding:24px;
  border-radius:22px;
  background:var(--surface);
  box-shadow:var(--shadow);
}

.share-box h2{
  font-family:var(--display);
  margin-bottom:14px;
  font-size:22px;
  letter-spacing:-.02em;
}

.share-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.share-buttons button{
  border:0;
  height:42px;
  padding:0 18px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  font-family:inherit;
  transition:filter .15s ease;
}

.share-buttons button:hover{
  filter:brightness(1.1);
}

.share-buttons button[hidden]{
  display:none;
}

.whatsapp{ background:#1a9c4b; color:#fff; }
.facebook{ background:#1877F2; color:#fff; }
.x{ background:#0d1220; color:#fff; }
.copy,
.native{ background:var(--soft); color:var(--text); }

.share-status{
  margin-top:12px;
  font-size:14px;
  color:var(--muted);
  min-height:20px;
}

/* RELATED STORIES */

.related{
  margin-top:64px;
}

.related h2{
  font-family:var(--display);
  font-size:clamp(26px,3vw,34px);
  font-weight:800;
  letter-spacing:-.03em;
  margin-bottom:20px;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.related-card{
  display:block;
}

.related-media{
  aspect-ratio:16/10;
  border-radius:18px;
  overflow:hidden;
  background:var(--soft);
}

.related-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .5s ease;
}

.related-card:hover .related-media img{
  transform:scale(1.04);
}

.related-content{
  padding-top:14px;
}

.related-category{
  color:var(--accent-text);
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

.related-title{
  font-family:var(--display);
  font-size:21px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.02em;
}

.related-card:hover .related-title{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:3px;
  text-decoration-color:var(--red);
}

/* LOADING */

.skeleton{
  position:relative;
  overflow:hidden;
  background:var(--soft);
  border-radius:20px;
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-100%);
  animation:shimmer 1.4s infinite;
}

@keyframes shimmer{
  100%{ transform:translateX(100%); }
}

.sk-line{
  height:22px;
  max-width:760px;
  margin:0 auto 14px;
}

.sk-title{
  height:64px;
  max-width:760px;
  margin:0 auto 22px;
}

.sk-image{
  height:420px;
  margin-top:28px;
  border-radius:26px;
}

/* ERROR */

.error{
  max-width:560px;
  margin:40px auto;
  background:var(--surface);
  border-radius:24px;
  padding:48px 26px;
  text-align:center;
  box-shadow:var(--shadow);
}

.error h1{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:-.02em;
  margin-bottom:12px;
}

.error p{
  color:var(--muted);
  margin-bottom:22px;
}

.error a{
  display:inline-block;
  background:var(--red);
  color:#fff;
  padding:12px 22px;
  font-weight:700;
  border-radius:999px;
}

/* FOOTER */

footer{
  background:var(--ink);
  color:var(--on-ink);
  margin-top:70px;
  border-radius:32px 32px 0 0;
}

.footer-inner{
  max-width:1280px;
  margin:0 auto;
  padding:44px 20px 28px;
  display:flex;
  justify-content:space-between;
  gap:30px;
}

.footer-brand p{
  color:#aab3c8;
  margin-top:12px;
  font-size:15px;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:12px 22px;
  align-content:flex-start;
  max-width:460px;
}

.footer-links a{
  color:#aab3c8;
  font-size:15px;
}

.footer-links a:hover{
  color:#fff;
}

.copyright{
  max-width:1280px;
  margin:0 auto;
  border-top:1px solid #1f2842;
  padding:20px;
  color:#8b95ad;
  font-size:13px;
}

/* TABLET + MOBILE */

@media(max-width:900px){

  .related-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .wrap,
  .nav-inner,
  .article-container{
    padding-left:14px;
    padding-right:14px;
  }

  .header-inner{
    height:58px;
  }

  .logo{
    font-size:21px;
  }

  .logo-mark{
    width:30px;
    height:30px;
    font-size:18px;
  }

  .icon-btn{
    width:40px;
    padding:0;
    justify-content:center;
  }

  .icon-btn .btn-text{
    display:none;
  }

  .article-container{
    padding-top:22px;
  }

  .article-body{
    font-size:18px;
    line-height:1.75;
  }

  .article-body h2{
    font-size:26px;
  }

  .article-body blockquote{
    font-size:22px;
  }

  .hero-image{
    max-height:340px;
    border-radius:20px;
    margin-bottom:28px;
  }

  .sk-image{
    height:260px;
  }

  .share-box{
    padding:20px 16px;
    border-radius:20px;
  }

  footer{
    border-radius:26px 26px 0 0;
  }

  .footer-inner{
    flex-direction:column;
  }

}

</style>

</head>

<div class="progress" id="progress" aria-hidden="true"></div>

          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="btn-text">Theme</span>
        </button>

        <a href="search.html" class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

      </div>

    </div>

  </header>

  <nav aria-label="Main">

      <a href="/?category=World">World</a>

    </div>

  </nav>

</div>

  <div class="breaking-inner">

      <span class="live-dot" aria-hidden="true"></span>

    </div>

  </div>

        <span>Nexora News</span>
      </a>

      <p>Fast, clear reporting on the UK, London and the world.</p>

    </div>

    <div class="footer-links">

/* ESCAPE HTML */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SLUG (used only for old links) */

function makeSlug(title){

  return String(title || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}


/* ARTICLE URL: uses the stored slug */

function articleUrl(article){

  return "article.html?slug=" +
    encodeURIComponent(
      article.slug || makeSlug(article.title)
    );

}


/* DATE */

function formatDate(date){

  if(!date){
    return "";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );

}

/* SEO HELPERS */

function setMeta(selector,attr,value){

  const el = document.querySelector(selector);

  if(el && value){
    el.setAttribute(attr,value);
  }

}

function updateSEO(article){

  const title =
    article.title + " | Nexora News";

  const description =
    article.excerpt ||
    "Read the latest news and stories from Nexora News.";

  const canonical =
    window.location.origin +
    window.location.pathname +
    "?slug=" +
    encodeURIComponent(
      article.slug || makeSlug(article.title)
    );

  const image =
    article.image_url || DEFAULT_IMAGE;

  document.title = title;

  setMeta('meta[name="description"]','content',description);
  setMeta('link[rel="canonical"]','href',canonical);

  setMeta('meta[property="og:title"]','content',title);
  setMeta('meta[property="og:description"]','content',description);
  setMeta('meta[property="og:url"]','content',canonical);
  setMeta('meta[property="og:image"]','content',image);

  setMeta('meta[name="twitter:title"]','content',title);
  setMeta('meta[name="twitter:description"]','content',description);
  setMeta('meta[name="twitter:image"]','content',image);

  const published =
    article.published_at || article.created_at;

  const schema =
    document.getElementById("articleSchema");

  if(schema){

    schema.textContent =
      JSON.stringify({

        "@context":"https://schema.org",
        "@type":"NewsArticle",
        "headline":article.title,
        "description":description,
        "image":[image],
        "datePublished":published,
        "dateModified":article.updated_at || published,

        "author":{
          "@type":"Person",
          "name":article.author || "Nexora News"
        },

        "publisher":{
          "@type":"Organization",
          "name":"Nexora News"
        },

        "mainEntityOfPage":{
          "@type":"WebPage",
          "@id":canonical
        }

      });

  }

  /* Language of the article (needs a "language" column: ha, so, en) */

  const lang =
    String(article.language || article.lang || "")
      .toLowerCase();

  if(/^[a-z]{2,3}$/.test(lang)){
    document.documentElement.lang = lang;
  }

}


/* CLEAN ARTICLE BODY */

let purifyReady = false;

function initPurify(){

  if(purifyReady || !window.DOMPurify){
    return;
  }

  /* Only allow video embeds from trusted sites */

  DOMPurify.addHook(
    "afterSanitizeAttributes",
    node => {

      if(node.tagName === "IFRAME"){

        const src =
          node.getAttribute("src") || "";

        const ok =
          /^https:\/\/(www\.)?(youtube\.com|youtube-nocookie\.com|player\.vimeo\.com)\//
            .test(src);

        if(!ok){
          node.remove();
        }

      }

    }
  );

  purifyReady = true;

}

function renderBody(raw){

  const body = raw || "";

  const looksLikeHtml =
    /<\/?(p|h2|h3|h4|ul|ol|li|br|img|div|blockquote|iframe|a|strong|em)\b/i
      .test(body);

  if(looksLikeHtml && window.DOMPurify){

    initPurify();

    return DOMPurify.sanitize(
      body,
      {
        ADD_TAGS:["iframe"],
        ADD_ATTR:[
          "allow",
          "allowfullscreen",
          "frameborder",
          "loading"
        ]
      }
    );

  }

  /* plain text (or the cleaner failed to load): show as text */

  return body
    .split(/\n\s*\n/)
    .filter(p => p.trim())
    .map(p =>
      `<p>${esc(p).replace(/\n/g,"<br>")}</p>`
    )
    .join("");

}


/* SMALL QUERIES */

async function loadBreaking(){

  const { data, error } = await db
    .from("articles")
    .select("title")
    .eq("status","published")
    .eq("is_breaking",true)
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    })
    .limit(5);

  if(error || !data || !data.length){
    return;
  }

  document.getElementById("breaking").style.display = "block";

  document.getElementById("ticker").innerHTML =
    `<span>${esc(data.map(a => a.title).join("     •     "))}</span>`;

}

async function loadRelated(article){

  if(!article.category){
    return [];
  }

  const { data, error } = await db
    .from("articles")
    .select("id,title,slug,category,image_url")
    .eq("status","published")
    .eq("category",article.category)
    .neq("id",article.id)
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    })
    .limit(3);

  return error ? [] : (data || []);

}


/* FIND ARTICLE: by slug first, then by old title-based links */

async function findArticle(slug){

  const first = await db
    .from("articles")
    .select("*")
    .eq("status","published")
    .eq("slug",slug)
    .maybeSingle();

  if(first.error){
    return { error:first.error };
  }

  if(first.data){
    return { article:first.data };
  }

  /* Old links were built from the title */

  const list = await db
    .from("articles")
    .select("id,title")
    .eq("status","published")
    .limit(500);

  if(list.error){
    return { error:list.error };
  }

  const match =
    (list.data || []).find(item => {

      const titleSlug = makeSlug(item.title);

      return (
        titleSlug &&
        (
          slug === titleSlug ||
          slug.startsWith(titleSlug + "-")
        )
      );

    });

  if(!match){
    return { article:null };
  }

  const full = await db
    .from("articles")
    .select("*")
    .eq("id",match.id)
    .maybeSingle();

  if(full.error){
    return { error:full.error };
  }

  return { article:full.data };

}

/* READING PROGRESS BAR */

function initProgress(){

  const bar = document.getElementById("progress");

  function update(){

    const max =
      document.documentElement.scrollHeight -
      window.innerHeight;

    const ratio =
      max > 0
        ? Math.min(1,Math.max(0,window.scrollY / max))
        : 0;

    bar.style.transform = "scaleX(" + ratio + ")";

  }

  window.addEventListener("scroll",update,{ passive:true });
  window.addEventListener("resize",update);

  update();

}


/* THEME TOGGLE */

function initTheme(){

  document
    .getElementById("themeToggle")
    .addEventListener("click",() => {

      const root = document.documentElement;

      const current =
        root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      const next =
        current === "dark" ? "light" : "dark";

      root.setAttribute("data-theme",next);

      try{
        localStorage.setItem("theme",next);
      }catch(e){}

    });

}


initTheme();
