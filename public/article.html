<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nexora News | Article</title>

<meta name="description"
      content="Read the latest news and stories from Nexora News.">

<meta name="author"
      content="Nexora News">

<meta property="og:type"
      content="article">

<meta property="og:site_name"
      content="Nexora News">

<meta name="twitter:card"
      content="summary_large_image">

<link rel="icon" href="data:,">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#111;
  line-height:1.7;
}

/* HEADER */

header{
  background:#fff;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  color:#111;
  text-decoration:none;
}

.logo span{
  color:#b00020;
}

.header-links{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-links a{
  text-decoration:none;
  color:#111;
  font-weight:700;
  padding:8px 12px;
  border-radius:5px;
}

.header-links a:hover{
  background:#eee;
}

.search-btn{
  background:#111;
  color:#fff !important;
}

/* NAVIGATION */

nav{
  background:#111;
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-inner a{
  color:#fff;
  text-decoration:none;
  padding:13px 17px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.nav-inner a:hover{
  background:#b00020;
}

/* BREAKING NEWS */

.breaking{
  background:#b00020;
  color:#fff;
  overflow:hidden;
}

.breaking-inner{
  max-width:1250px;
  margin:auto;
  min-height:44px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.breaking-label{
  background:#111;
  color:#fff;
  font-weight:900;
  padding:12px 16px;
  white-space:nowrap;
  flex-shrink:0;
  z-index:5;
  font-size:12px;
}

.ticker{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
}

.ticker span{
  display:inline-block;
  padding:11px 0 11px 100%;
  white-space:nowrap;
  animation:tickerMove 22s linear infinite;
}

@keyframes tickerMove{
  0%{
    transform:translateX(0);
  }

  100%{
    transform:translateX(-100%);
  }
}

/* ARTICLE */

.article-container{
  max-width:950px;
  margin:45px auto;
  padding:0 20px;
}

.article-card{
  background:#fff;
  padding:40px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.category{
  display:inline-block;
  background:#b00020;
  color:#fff;
  font-size:12px;
  font-weight:900;
  padding:6px 12px;
  margin-bottom:18px;
  text-transform:uppercase;
}

.breaking-badge{
  display:inline-block;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:900;
  padding:6px 12px;
  margin-left:8px;
  margin-bottom:18px;
  text-transform:uppercase;
}

.article-title{
  font-size:46px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-1.2px;
  margin-bottom:18px;
}

.article-excerpt{
  font-size:20px;
  color:#555;
  line-height:1.55;
  margin-bottom:20px;
}

.article-meta{
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  padding:13px 0;
  margin-bottom:28px;
  color:#555;
  font-size:14px;
}

.article-meta strong{
  color:#111;
}

.hero-image{
  width:100%;
  max-height:540px;
  object-fit:cover;
  display:block;
  margin-bottom:32px;
}

.article-body{
  font-size:18px;
  line-height:1.85;
  color:#222;
}

.article-body p{
  margin-bottom:22px;
}

.article-body h2{
  font-size:28px;
  line-height:1.3;
  margin:32px 0 14px;
}

.article-body h3{
  font-size:23px;
  margin:28px 0 12px;
}

.article-body img{
  max-width:100%;
  height:auto;
  display:block;
  margin:25px auto;
}

.article-body a{
  color:#b00020;
  font-weight:700;
}

/* SHARE */

.share-box{
  border-top:1px solid #ddd;
  margin-top:35px;
  padding-top:25px;
}

.share-box h3{
  margin-bottom:15px;
  font-size:20px;
}

.share-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.share-buttons button,
.share-buttons a{
  border:0;
  padding:10px 15px;
  border-radius:5px;
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
}

.whatsapp{
  background:#25D366;
  color:#fff;
}

.facebook{
  background:#1877F2;
  color:#fff;
}

.x{
  background:#111;
  color:#fff;
}

.copy{
  background:#ddd;
  color:#111;
}

/* RELATED STORIES */

.related{
  margin-top:45px;
}

.related h2{
  font-size:27px;
  margin-bottom:20px;
  border-left:5px solid #b00020;
  padding-left:12px;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.related-card{
  background:#fff;
  text-decoration:none;
  color:#111;
  display:block;
  border:1px solid #ddd;
  transition:.2s;
}

.related-card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.related-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  display:block;
}

.related-content{
  padding:15px;
}

.related-category{
  color:#b00020;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:5px;
}

.related-title{
  font-size:17px;
  font-weight:900;
  line-height:1.35;
}

/* LOADING */

.loading{
  text-align:center;
  padding:80px 20px;
  font-size:20px;
  color:#555;
}

/* ERROR */

.error{
  background:#fff;
  padding:50px 25px;
  text-align:center;
}

.error h1{
  font-size:32px;
  margin-bottom:12px;
}

.error p{
  color:#666;
  margin-bottom:20px;
}

.error a{
  display:inline-block;
  background:#b00020;
  color:#fff;
  padding:10px 18px;
  text-decoration:none;
  font-weight:800;
  border-radius:5px;
}

/* FOOTER */

footer{
  background:#111;
  color:#fff;
  margin-top:60px;
}

.footer-inner{
  max-width:1250px;
  margin:auto;
  padding:35px 20px;
  display:flex;
  justify-content:space-between;
  gap:30px;
}

.footer-logo{
  font-size:24px;
  font-weight:900;
}

.footer-logo span{
  color:#e00028;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.footer-links a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
}

.copyright{
  border-top:1px solid #333;
  text-align:center;
  padding:18px;
  color:#aaa;
  font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

  .header-inner{
    min-height:62px;
    padding:0 12px;
  }

  .logo{
    font-size:22px;
  }

  .header-links a{
    padding:6px 8px;
    font-size:12px;
  }

  .nav-inner a{
    padding:12px 13px;
    font-size:12px;
  }

  .breaking-label{
    padding:12px 10px;
    font-size:10px;
  }

  .ticker{
    font-size:12px;
  }

  .article-container{
    margin:20px auto;
    padding:0 10px;
  }

  .article-card{
    padding:22px 17px;
  }

  .article-title{
    font-size:31px;
    line-height:1.15;
  }

  .article-excerpt{
    font-size:17px;
  }

  .article-body{
    font-size:17px;
    line-height:1.75;
  }

  .article-body h2{
    font-size:24px;
  }

  .hero-image{
    max-height:320px;
    margin-bottom:22px;
  }

  .related-grid{
    grid-template-columns:1fr;
  }

  .related-card img{
    height:200px;
  }

  .footer-inner{
    flex-direction:column;
  }

}

</style>
</head>

  <div class="header-inner">

    <div class="header-links">

      <a href="index.html">

<nav>

    <a href="index.html?category=UK">

         id="ticker">

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ESCAPE HTML */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SLUG */

function makeSlug(title){

  return String(title || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}


/* DATE */

function formatDate(date){

  if(!date){
    return "";
  }

  const d =
    new Date(date);

  if(isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );

}


/* ARTICLE URL */

function articleUrl(article){

  return "article.html?slug=" +
    encodeURIComponent(
      makeSlug(article.title)
    );

}


/* SHARE */

function shareArticle(){

  const url =
    window.location.href;

  const title =
    document.title;

  const whatsapp =
    "https://wa.me/?text=" +
    encodeURIComponent(
      title + " " + url
    );

  window.open(
    whatsapp,
    "_blank"
  );

}


/* FACEBOOK */

function shareFacebook(){

  const url =
    window.location.href;

  const facebook =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(url);

  window.open(
    facebook,
    "_blank",
    "width=600,height=500"
  );

}


/* X */

function shareX(){

  const url =
    window.location.href;

  const title =
    document.title;

  const x =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(title) +
    "&url=" +
    encodeURIComponent(url);

  window.open(
    x,
    "_blank",
    "width=600,height=500"
  );

}


/* COPY LINK */

async function copyLink(){

  const url =
    window.location.href;

  try{

    await navigator.clipboard.writeText(url);

    alert("Article link copied.");

  }catch(error){

    prompt(
      "Copy this article link:",
      url
    );

  }

}


/* LOAD ARTICLE */

async function loadArticle(){

  const container =
    document.getElementById(
      "articleContainer"
    );

  const params =
    new URLSearchParams(
      window.location.search
    );

  const slug =
    params.get("slug");

  if(!slug){

    container.innerHTML = `
      <div class="error">
        <h1>Article not found</h1>
        <p>No article was selected.</p>
        <a href="index.html">
          Back to Home
        </a>
      </div>
    `;

    return;

  }


  const {
    data,
    error
  } =
    await db
      .from("articles")
      .select("*")
      .eq("status","published")
      .order(
        "published_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="error">
        <h1>Unable to load article</h1>
        <p>Please try again later.</p>
        <a href="index.html">
          Back to Home
        </a>
      </div>
    `;

    return;

  }


  const articles =
    data || [];


  /*
    Match:
    1. Exact article slug
    2. Old timestamped slug
  */

  const article =
    articles.find(item => {

      const titleSlug =
        makeSlug(item.title);

      return (
        slug === titleSlug ||
        slug.startsWith(
          titleSlug + "-"
        )
      );

    });


  if(!article){

    container.innerHTML = `
      <div class="error">
        <h1>Article not found</h1>

        <p>
          The article may have been removed
          or the link may be incorrect.
        </p>

        <a href="index.html">
          Back to Home
        </a>
      </div>
    `;

    return;

  }


  /* PAGE TITLE */

  document.title =
    article.title +
    " | Nexora News";


  /* META DESCRIPTION */

  const description =
    article.excerpt ||
    "Latest news from Nexora News.";


  let meta =
    document.querySelector(
      'meta[name="description"]'
    );

  if(meta){

    meta.setAttribute(
      "content",
      description
    );

  }


  /* BREAKING NEWS */

  const breakingArticles =
    articles
      .filter(
        item =>
          item.is_breaking === true
      )
      .slice(0,5);


  if(
    breakingArticles.length
  ){

    document.getElementById(
      "breaking"
    ).style.display =
      "block";


    const text =
      breakingArticles
        .map(
          item => item.title
        )
        .join("   •   ");


    document.getElementById(
      "ticker"
    ).innerHTML =
      `<span>${esc(text)}</span>`;

  }


  /* ARTICLE BODY */

  let body =
    article.body || "";


  /*
    If body is plain text,
    preserve line breaks.
  */

  if(
    !body.includes("<p>") &&
    !body.includes("<h2>") &&
    !body.includes("<h3>") &&
    !body.includes("<br")
  ){

    body =
      body
        .split(/\n\s*\n/)
        .map(
          paragraph =>
            `<p>${esc(paragraph)
              .replace(/\n/g,"<br>")}</p>`
        )
        .join("");

  }


  /* HERO IMAGE */

  const image =
    article.image_url
      ? `
        <img
          class="hero-image"
          src="${esc(article.image_url)}"
          alt="${esc(article.title)}"
          onerror="this.style.display='none'"
        >
      `
      : "";


  /* BREAKING BADGE */

  const breakingBadge =
    article.is_breaking === true
      ? `
        <span class="breaking-badge">
          BREAKING NEWS
        </span>
      `
      : "";


  /* RELATED STORIES */

  const related =
    articles
      .filter(item =>
        item.id !== article.id &&
        item.category === article.category
      )
      .slice(0,3);


  let relatedHTML = "";


  if(related.length){

    relatedHTML = `
      <section class="related">

        <h2>
          Related Stories
        </h2>

        <div class="related-grid">

          ${related.map(item => `

            <a
              class="related-card"
              href="${articleUrl(item)}"
            >

              ${
                item.image_url
                ?
                `
                <img
                  src="${esc(item.image_url)}"
                  alt="${esc(item.title)}"
                  onerror="this.style.display='none'"
                >
                `
                :
                ""
              }

              <div class="related-content">

                <div class="related-category">
                  ${esc(item.category || "News")}
                </div>

                <div class="related-title">
                  ${esc(item.title)}
                </div>

              </div>

            </a>

          `).join("")}

        </div>

      </section>
    `;

  }


  /* RENDER */

  container.innerHTML = `

    <article class="article-card">

      <div>

        <span class="category">
          ${esc(article.category || "News")}
        </span>

        ${breakingBadge}

      </div>


      <h1 class="article-title">
        ${esc(article.title)}
      </h1>


      ${
        article.excerpt
        ?
        `
        <div class="article-excerpt">
          ${esc(article.excerpt)}
        </div>
        `
        :
        ""
      }


      <div class="article-meta">

        By
        <strong>
          ${esc(article.author || "Nexora News")}
        </strong>

        &nbsp; • &nbsp;

        ${formatDate(
          article.published_at ||
          article.created_at
        )}

      </div>


      ${image}


      <div class="article-body">

        ${body}

      </div>


      <div class="share-box">

        <h3>
          Share this story
        </h3>

        <div class="share-buttons">

          <button
            class="whatsapp"
            onclick="shareArticle()"
          >
            WhatsApp
          </button>


          <button
            class="facebook"
            onclick="shareFacebook()"
          >
            Facebook
          </button>


          <button
            class="x"
            onclick="shareX()"
          >
            X
          </button>


          <button
            class="copy"
            onclick="copyLink()"
          >
            Copy Link
          </button>

        </div>

      </div>

    </article>


    ${relatedHTML}

  `;

}


loadArticle();

</script>

</body>
</html>
