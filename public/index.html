<style>

:root{

  --line:#ddd;

}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e10;
    --surface:#1a1a1d;
    --text:#f1f1f1;
    --muted:#b8b8b8;
    --meta:#9c9c9c;
    --line:#333;
    --accent-text:#ff6b7d;
    --nav:#000;
    --trend:#000;

}

:root[data-theme="dark"]{
  --bg:#0e0e10;
  --surface:#1a1a1d;
  --text:#f1f1f1;
  --muted:#b8b8b8;
  --meta:#9c9c9c;
  --line:#333;

}

*{

  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

}

a{

}

a:focus-visible,
button:focus-visible,
input:focus-visible{
  outline:3px solid #ffbf47;
  outline-offset:2px;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.skip-link{
  position:absolute;
  left:-999px;
  top:0;
  background:#ffbf47;
  color:#111;
  padding:10px 14px;
  font-weight:800;
  z-index:100;
}

.skip-link:focus{
  left:0;
}

.topbar{
  height:6px;

}

header{
  background:var(--surface);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1250px;

  padding:20px 18px;

  align-items:center;

.logo{

  font-weight:900;

}

.logo span{
  color:var(--accent-text);
}

.search-link,
.theme-toggle{
  font-size:14px;
  font-weight:800;
  padding:9px 13px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  font-family:inherit;
}

.search-link:hover,
.theme-toggle:hover{

}

nav{

}

.nav-inner{

}

.nav-inner::-webkit-scrollbar{

nav a{

  white-space:nowrap;

nav a:hover,

}

/* BREAKING */

.breaking{
  background:var(--red);
  color:#fff;
  display:none;
  overflow:hidden;
}

.breaking-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  min-height:44px;
  overflow:hidden;
}

.breaking-label{
  background:#111;
  color:#fff;
  font-weight:900;
  padding:13px 16px;
  white-space:nowrap;
  flex-shrink:0;
  position:relative;
  z-index:5;
  font-size:12px;
}

.ticker{
  flex:1;
  min-width:0;
  overflow:hidden;
  position:relative;
  padding:13px 0;
  white-space:nowrap;
}

.ticker span{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation:tickerMove 22s linear infinite;
}

.breaking:hover .ticker span,
.breaking:focus-within .ticker span{
  animation-play-state:paused;
}

@keyframes tickerMove{
  0%{
    transform:translateX(0);
  }

  100%{
    transform:translateX(-100%);
  }
}

@media (prefers-reduced-motion: reduce){

  .ticker{
    overflow-x:auto;
  }

  .ticker span{
    animation:none;
    padding-left:0;
  }

  html{
    scroll-behavior:auto;
  }

  *{
    transition:none !important;
  }

}

}

.hero-overlay{
  position:absolute;
  left:0;

<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

/* Shown when an article has no author */
const DEFAULT_AUTHOR = "Marian";

const HOME_LIMIT = 80;
const CATEGORY_LIMIT = 60;

const FALLBACK_IMG =
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80";

/* Only the columns the homepage needs (no article body) */
const COLUMNS =
"id,title,slug,excerpt,category,author,image_url,published_at,created_at,is_breaking";

let db = null;

/* ESCAPE */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* SLUG (only a fallback when the database has no slug) */

function makeSlug(title){

  return String(title || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}

/* ARTICLE URL: uses the stored slug */

function articleUrl(article){

  const slug =
    article.slug || makeSlug(article.title);

  return "article.html?slug=" +
    encodeURIComponent(slug);

}

/* IMAGES */

function imageOrFallback(url){
  return url || FALLBACK_IMG;
}

function img(a,w,h,extra){

  return `<img
    src="${esc(imageOrFallback(a.image_url))}"
    alt="${esc(a.title)}"
    width="${w}"
    height="${h}"
    decoding="async"
    ${extra || 'loading="lazy"'}
    onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"
  >`;

}

function fmtDate(a){

  const d =
    new Date(a.published_at || a.created_at);

  return isNaN(d)
    ? ""
    : d.toLocaleDateString("en-GB");

}

/* NEWS CARD */

function card(a){

  return `

    <a class="card" href="${articleUrl(a)}">

      ${img(a,600,200)}

      <div class="card-body">

        <div class="category">
          ${esc(a.category)}
        </div>

        ${
          a.is_breaking
          ? '<div class="breaking-badge">BREAKING NEWS</div>'
          : ''
        }

        <h3>${esc(a.title)}</h3>

        <p class="excerpt">
          ${esc(a.excerpt || "")}
        </p>

        <div class="meta">
          By ${esc(a.author || DEFAULT_AUTHOR)}
          ${fmtDate(a) ? " · " + esc(fmtDate(a)) : ""}
        </div>

      </div>

    </a>

  `;

}

/* SIDE CARD */

function sideCard(a){

  return `

    <a class="side-card" href="${articleUrl(a)}">

      ${img(a,135,140)}

      <div class="side-content">

        <div class="category">
          ${esc(a.category)}
        </div>

        ${
          a.is_breaking
          ? '<div class="breaking-badge">BREAKING</div>'
          : ''
        }

        <div class="side-title">
          ${esc(a.title)}
        </div>

      </div>

    </a>

  `;

}

/* TRENDING CARD */

function trendingCard(a,index){

  return `

    <a class="trending-card" href="${articleUrl(a)}">

      ${img(a,95,100)}

      <div class="trending-body">

        <div class="trending-number">
          #${index + 1} TRENDING
        </div>

        <h3>${esc(a.title)}</h3>

      </div>

    </a>

  `;

}

/* MORE STORIES CARD */

function featuredCard(a){

  return `

    <a class="featured-card" href="${articleUrl(a)}">

      ${img(a,300,150)}

      <div class="featured-body">

        <div class="category">
          ${esc(a.category)}
        </div>

        <h3>${esc(a.title)}</h3>

      </div>

    </a>

  `;

}

/* SECTION (category link is optional) */

function section(title,items,category){

  if(!items.length){
    return "";
  }

  const link = category
    ? `<a class="viewall" href="/?category=${encodeURIComponent(category)}">VIEW ALL →</a>`
    : "";

  return `

    <section class="section">

      <div class="section-head">

        <h2>${esc(title)}</h2>

        ${link}

      </div>

      <div class="grid">
        ${items.map(card).join("")}
      </div>

    </section>

  `;

}

/* HELPERS */

function showMessage(html){
  document.getElementById("app").innerHTML =
    `<div class="empty">${html}</div>`;
}

function setActiveNav(category){

  document
    .querySelectorAll("nav a")
    .forEach(a => {

      const match =
        (a.dataset.cat || "") ===
        (category || "").toLowerCase();

      if(match){
        a.setAttribute("aria-current","page");
      }else{
        a.removeAttribute("aria-current");
      }

    });

}

function baseQuery(){

  return db
    .from("articles")
    .select(COLUMNS)
    .eq("status","published")
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    });

}

/* BREAKING TICKER */

async function loadBreaking(){

  const { data, error } = await db
    .from("articles")
    .select("title")
    .eq("status","published")
    .eq("is_breaking",true)
    .order("published_at",{
      ascending:false,
      nullsFirst:false
    })
    .limit(5);

  if(error || !data || !data.length){
    return;
  }

  document.getElementById("breaking").style.display = "block";

  const text =
    data.map(a => a.title).join("   •   ");

  document.getElementById("ticker").innerHTML =
    `<span>${esc(text)}</span>`;

}

/* LOAD NEWS */

async function loadNews(){

  if(!window.supabase){
    showMessage(
      "Unable to load news. Check your connection and refresh the page."
    );
    return;
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const params =
    new URLSearchParams(window.location.search);

  /* letters and spaces only */
  const selectedCategory =
    (params.get("category") || "")
      .replace(/[^a-zA-Z ]/g,"")
      .trim();

  setActiveNav(selectedCategory);

  loadBreaking();

  /* CATEGORY PAGE: filtered in the database */

  if(selectedCategory){

    document.title =
      selectedCategory + " News | Nexora News";

    const { data, error } =
      await baseQuery()
        .ilike("category",selectedCategory)
        .limit(CATEGORY_LIMIT);

    if(error){
      console.error(error);
      showMessage(
        "Unable to load news. Please refresh the page in a moment."
      );
      return;
    }

    const filtered = data || [];

    document.getElementById("app").innerHTML = `

      <section class="section">

        <div class="section-head">

          <h2>${esc(selectedCategory.toUpperCase())} NEWS</h2>

          <a class="viewall" href="/">← HOME</a>

        </div>

        ${
          filtered.length
          ? `<div class="grid">${filtered.map(card).join("")}</div>`
          : `<div class="empty">No ${esc(selectedCategory)} news found.</div>`
        }

      </section>

    `;

    return;

  }

  /* HOMEPAGE */

  const { data, error } =
    await baseQuery().limit(HOME_LIMIT);

  if(error){
    console.error(error);
    showMessage(
      "Unable to load news. Please refresh the page in a moment."
    );
    return;
  }

  const articles = data || [];

  if(!articles.length){
    showMessage("No published news yet.");
    return;
  }

  /* Each top block shows different stories */

  const hero     = articles[0];
  const side     = articles.slice(1,4);
  const trending = articles.slice(4,10);
  const more     = articles.slice(10,14);

  const by = cat =>
    articles
      .filter(a =>
        String(a.category || "").toLowerCase() === cat
      )
      .slice(0,6);

  document.getElementById("app").innerHTML = `

    <!-- TOP STORY -->

    <section class="hero">

      <a class="hero-main" href="${articleUrl(hero)}">

        ${img(hero,1000,450,'fetchpriority="high"')}

        <div class="hero-overlay">

          <div class="label">TOP STORY</div>

          ${
            hero.is_breaking
            ? '<div class="breaking-badge">BREAKING NEWS</div>'
            : ''
          }

          <h2 class="hero-title">
            ${esc(hero.title)}
          </h2>

          <p class="hero-excerpt">
            ${esc(hero.excerpt || "")}
          </p>

        </div>

      </a>

      <div class="side">
        ${side.map(sideCard).join("")}
      </div>

    </section>

    <!-- TRENDING NEWS -->

    ${
      trending.length
      ? `
        <section class="trending-wrap">

          <h2 class="trending-title">
            <span aria-hidden="true">🔥</span> TRENDING NEWS
          </h2>

          <div class="trending-grid">
            ${trending.map((a,i) => trendingCard(a,i)).join("")}
          </div>

        </section>
      `
      : ""
    }

    <!-- MORE STORIES -->

    ${
      more.length
      ? `
        <section class="section">

          <div class="section-head">
            <h2>MORE STORIES</h2>
          </div>

          <div class="featured">
            ${more.map(featuredCard).join("")}
          </div>

        </section>
      `
      : ""
    }

    ${section("LONDON",     by("london"),     "London")}
    ${section("UK",         by("uk"),         "UK")}
    ${section("WORLD",      by("world"),      "World")}
    ${section("BUSINESS",   by("business"),   "Business")}
    ${section("TECHNOLOGY", by("technology"), "Technology")}
    ${section("SPORTS",     by("sports"),     "Sports")}
    ${section("VIDEO",      by("video"),      "Video")}

  `;

}

/* THEME TOGGLE */

function initTheme(){

  const btn =
    document.getElementById("themeToggle");

  btn.addEventListener("click",() => {

    const root = document.documentElement;

    const current =
      root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light");

    const next =
      current === "dark" ? "light" : "dark";

    root.setAttribute("data-theme",next);

    try{
      localStorage.setItem("theme",next);
    }catch(e){}

  });

}

/* NEWSLETTER (needs a "subscribers" table in Supabase) */

function initNewsletter(){

  const form  = document.getElementById("newsletter");
  const input = document.getElementById("newsletterEmail");
  const btn   = document.getElementById("newsletterBtn");
  const msg   = document.getElementById("newsletterMsg");

  form.addEventListener("submit", async e => {

    e.preventDefault();

    const email = input.value.trim();

    if(!input.checkValidity() || !email){
      msg.textContent = "Enter a valid email address.";
      return;
    }

    if(!db){
      msg.textContent = "Subscription is unavailable right now. Try again later.";
      return;
    }

    btn.disabled = true;
    msg.textContent = "Subscribing...";

    const { error } =
      await db.from("subscribers").insert({ email });

    btn.disabled = false;

    if(!error){
      msg.textContent = "You're subscribed. Thank you!";
      form.reset();
      return;
    }

    if(error.code === "23505"){
      msg.textContent = "This email is already subscribed.";
      return;
    }

    console.error(error);
    msg.textContent = "Could not subscribe: " + (error.message || error.code || "unknown error");

  });

}

/* START (deferred scripts finish before DOMContentLoaded) */

document.addEventListener("DOMContentLoaded",() => {

  initTheme();
  loadNews().then(initNewsletter);

});

</script>
