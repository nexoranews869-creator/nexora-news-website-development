*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f6f6f6;color:#171717}a{text-decoration:none;color:inherit}.topbar{height:6px;background:#b00020}header{background:#fff;border-bottom:1px solid #ddd}.header-inner{max-width:1250px;margin:auto;padding:20px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:34px;font-weight:900;letter-spacing:-1.5px}.logo span{color:#b00020}.search-link{font-weight:700}nav{background:#111;color:#fff}.nav-inner{max-width:1250px;margin:auto;display:flex;overflow:auto}nav a{padding:14px 15px;font-size:14px;font-weight:700;white-space:nowrap}nav a:hover{background:#b00020}.breaking{background:#b00020;color:#fff;display:none}.breaking-inner{max-width:1250px;margin:auto;display:flex;align-items:center;overflow:hidden}.breaking-label{font-weight:900;background:#111;padding:12px 15px;white-space:nowrap}.ticker{padding:12px 15px;white-space:nowrap;animation:ticker 20s linear infinite}@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}.container{max-width:1250px;margin:auto;padding:25px 18px}.hero{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-bottom:30px}.hero-main,.side-card,.card,.featured-card{background:#fff;border:1px solid #ddd}.hero-main{position:relative;overflow:hidden}.hero-main img{width:100%;height:420px;object-fit:cover;display:block}.hero-overlay{position:absolute;left:0;right:0;bottom:0;padding:25px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.88))}.label{display:inline-block;background:#b00020;color:#fff;padding:6px 9px;font-size:12px;font-weight:900;margin-bottom:10px}.hero-title{font-size:36px;line-height:1.08;font-weight:900}.side{display:grid;gap:14px}.side-card{display:grid;grid-template-columns:130px 1fr;min-height:125px;overflow:hidden}.side-card img{width:130px;height:125px;object-fit:cover}.side-content{padding:12px}.category{color:#b00020;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:7px}.side-title{font-size:18px;font-weight:800;line-height:1.2}.section{margin:35px 0}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #111;margin-bottom:15px}.section-head h2{font-size:25px;padding-bottom:8px}.viewall{font-size:13px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{overflow:hidden}.card img{width:100%;height:190px;object-fit:cover;display:block}.card-body{padding:15px}.card h3{font-size:20px;line-height:1.2;margin:7px 0}.excerpt{color:#555;line-height:1.45;font-size:14px}.meta{font-size:12px;color:#777;margin-top:12px}.featured{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.featured-card{padding:12px}.featured-card img{width:100%;height:130px;object-fit:cover;margin-bottom:9px}.featured-card h3{font-size:16px;line-height:1.25}.empty{background:#fff;border:1px solid #ddd;padding:25px;text-align:center;color:#666}footer{background:#111;color:#fff;margin-top:50px}.footer-inner{max-width:1250px;margin:auto;padding:35px 18px;text-align:center}.breaking-badge{display:inline-block;background:#b00020;color:#fff;padding:5px 8px;font-size:11px;font-weight:900;margin-bottom:8px}@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-main img{height:330px}.grid{grid-template-columns:repeat(2,1fr)}.featured{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.header-inner{padding:15px 12px}.logo{font-size:27px}nav a{padding:12px 11px;font-size:12px}.container{padding:18px 12px}.hero-main img{height:260px}.hero-title{font-size:27px}.side-card{grid-template-columns:105px 1fr}.side-card img{width:105px;height:110px}.side-title{font-size:16px}.grid,.featured{grid-template-columns:1fr}.card img{height:210px}}

<body>
<div class="topbar"></div>
<header><div class="header-inner"><a href="/" class="logo">NEXORA <span>NEWS</span></a><a href="search.html" class="search-link">🔍 SEARCH</a></div></header>
<nav><div class="nav-inner"><a href="/">HOME</a><a href="/?category=UK">UK</a><a href="/?category=London">LONDON</a><a href="/?category=World">WORLD</a><a href="/?category=Business">BUSINESS</a><a href="/?category=Technology">TECHNOLOGY</a><a href="/?category=Sports">SPORTS</a><a href="/?category=Video">VIDEO</a></div></nav>
<div id="breaking" class="breaking"><div class="breaking-inner"><div class="breaking-label">BREAKING NEWS</div><div id="ticker" class="ticker"></div></div></div>
<main class="container"><div id="app"><div class="empty">Loading latest news...</div></div></main>
<footer><div class="footer-inner"><strong>NEXORA NEWS</strong><p style="margin-top:8px;color:#bbb">UK, London & World News</p><p style="margin-top:15px;color:#888;font-size:12px">© 2026 Nexora News. All rights reserved.</p></div></footer>
<script>
const SUPABASE_URL="https://qleoqpmxvmqcythacszw.supabase.co";
const SUPABASE_KEY="sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function makeSlug(title){return String(title||"").toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-")}
function articleUrl(article){return "article.html?slug="+encodeURIComponent(makeSlug(article.title)+"-"+Date.now())}
function imageOrFallback(url){return url||"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80"}
function card(a){return `<a class="card" href="${articleUrl(a)}"><img src="${esc(imageOrFallback(a.image_url))}" alt="${esc(a.title)}" loading="lazy"><div class="card-body"><div class="category">${esc(a.category)}</div>${a.is_breaking?'<div class="breaking-badge">BREAKING NEWS</div>':''}<h3>${esc(a.title)}</h3><p class="excerpt">${esc(a.excerpt||"")}</p><div class="meta">By ${esc(a.author||"Marian")} · ${new Date(a.published_at||a.created_at).toLocaleDateString("en-GB")}</div></div></a>`}
function sideCard(a){return `<a class="side-card" href="${articleUrl(a)}"><img src="${esc(imageOrFallback(a.image_url))}" alt="${esc(a.title)}" loading="lazy"><div class="side-content"><div class="category">${esc(a.category)}</div>${a.is_breaking?'<div class="breaking-badge">BREAKING</div>':''}<div class="side-title">${esc(a.title)}</div></div></a>`}
function section(title,items,category){if(!items.length)return"";return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2><a class="viewall" href="/?category=${encodeURIComponent(category)}">VIEW ALL →</a></div><div class="grid">${items.map(card).join("")}</div></section>`}
async function loadNews(){
const {data,error}=await db.from("articles").select(`id,title,slug,excerpt,body,category,author,image_url,status,published_at,created_at,is_breaking`).eq("status","published").order("published_at",{ascending:false});
if(error){document.getElementById("app").innerHTML=`<div class="empty">Unable to load news.<br><small>${esc(error.message)}</small></div>`;return}
const articles=data||[];
if(!articles.length){document.getElementById("app").innerHTML='<div class="empty">No published news yet.</div>';return}
const params=new URLSearchParams(window.location.search);const selectedCategory=params.get("category");
const breaking=articles.filter(a=>a.is_breaking===true).slice(0,5);
if(breaking.length){document.getElementById("breaking").style.display="block";document.getElementById("ticker").textContent=breaking.map(a=>a.title).join("   •   ")}
if(selectedCategory){const filtered=articles.filter(a=>String(a.category||"").toLowerCase()===selectedCategory.toLowerCase());document.getElementById("app").innerHTML=`<section class="section"><div class="section-head"><h2>${esc(selectedCategory)} NEWS</h2><a class="viewall" href="/">← HOME</a></div>${filtered.length?`<div class="grid">${filtered.map(card).join("")}</div>`:`<div class="empty">No ${esc(selectedCategory)} news found.</div>`}</section>`;return}
const hero=articles[0],side=articles.slice(1,4),featured=articles.slice(0,4),latest=articles.slice(0,6);
const london=articles.filter(a=>String(a.category).toLowerCase()==="london").slice(0,6),uk=articles.filter(a=>String(a.category).toLowerCase()==="uk").slice(0,6),world=articles.filter(a=>String(a.category).toLowerCase()==="world").slice(0,6),business=articles.filter(a=>String(a.category).toLowerCase()==="business").slice(0,6),technology=articles.filter(a=>String(a.category).toLowerCase()==="technology").slice(0,6),sports=articles.filter(a=>String(a.category).toLowerCase()==="sports").slice(0,6),video=articles.filter(a=>String(a.category).toLowerCase()==="video").slice(0,6);
document.getElementById("app").innerHTML=`<section class="hero"><a class="hero-main" href="${articleUrl(hero)}"><img src="${esc(imageOrFallback(hero.image_url))}" alt="${esc(hero.title)}"><div class="hero-overlay"><div class="label">TOP STORY</div>${hero.is_breaking?'<div class="breaking-badge">BREAKING NEWS</div>':''}<div class="hero-title">${esc(hero.title)}</div><p style="margin-top:10px;line-height:1.4">${esc(hero.excerpt||"")}</p></div></a><div class="side">${side.map(sideCard).join("")}</div></section><section class="section"><div class="section-head"><h2>FEATURED NEWS</h2></div><div class="featured">${featured.map(a=>`<a class="featured-card" href="${articleUrl(a)}"><img src="${esc(imageOrFallback(a.image_url))}" alt="${esc(a.title)}" loading="lazy"><div class="category">${esc(a.category)}</div><h3>${esc(a.title)}</h3></a>`).join("")}</div></section>${section("LATEST NEWS",latest,"Latest")}${section("LONDON",london,"London")}${section("UK",uk,"UK")}${section("WORLD",world,"World")}${section("BUSINESS",business,"Business")}${section("TECHNOLOGY",technology,"Technology")}${section("SPORTS",sports,"Sports")}${section("VIDEO",video,"Video")}`;
}
loadNews();
</script>
</body>
</html>
