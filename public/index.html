<script>

const SUPABASE_URL =
"https://qleoqpmxvmqcythacszw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rvHVSnw6yw0_Zb-jxozVw_Fma9NccJ";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SLUG
========================= */

function makeSlug(title){

  return String(title || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}


/* =========================
   ARTICLE URL
========================= */

function articleUrl(article){

  function articleUrl(article){
  return "article.html?slug=" +
    encodeURIComponent(makeSlug(article.title));
}


/* =========================
   IMAGE FALLBACK
========================= */

function imageOrFallback(url){

  return url ||
  "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80";

}


/* =========================
   NEWS CARD
========================= */

function card(a){

  return `

    <a
      class="card"
      href="${articleUrl(a)}"
    >

      <img
        src="${esc(imageOrFallback(a.image_url))}"
        alt="${esc(a.title)}"
        loading="lazy"
      >

      <div class="card-body">

        <div class="category">
          ${esc(a.category)}
        </div>

        ${
          a.is_breaking
          ?
          '<div class="breaking-badge">BREAKING NEWS</div>'
          :
          ''
        }

        <h3>
          ${esc(a.title)}
        </h3>

        <p class="excerpt">
          ${esc(a.excerpt || "")}
        </p>

        <div class="meta">

          By ${esc(a.author || "Marian")}
          ·
          ${new Date(
            a.published_at || a.created_at
          ).toLocaleDateString("en-GB")}

        </div>

      </div>

    </a>

  `;

}


/* =========================
   SIDE CARD
========================= */

function sideCard(a){

  return `

    <a
      class="side-card"
      href="${articleUrl(a)}"
    >

      <img
        src="${esc(imageOrFallback(a.image_url))}"
        alt="${esc(a.title)}"
        loading="lazy"
      >

      <div class="side-content">

        <div class="category">
          ${esc(a.category)}
        </div>

        ${
          a.is_breaking
          ?
          '<div class="breaking-badge">BREAKING</div>'
          :
          ''
        }

        <div class="side-title">
          ${esc(a.title)}
        </div>

      </div>

    </a>

  `;

}


/* =========================
   SECTION
========================= */

function section(title,items,category){

  if(!items.length){
    return "";
  }

  return `

    <section class="section">

      <div class="section-head">

        <h2>
          ${esc(title)}
        </h2>

        <a
          class="viewall"
          href="/?category=${encodeURIComponent(category)}"
        >
          VIEW ALL →
        </a>

      </div>

      <div class="grid">

        ${items.map(card).join("")}

      </div>

    </section>

  `;

}


/* =========================
   LOAD NEWS
========================= */

async function loadNews(){

  const {
    data,
    error
  } = await db
    .from("articles")
    .select(`
      id,
      title,
      slug,
      excerpt,
      body,
      category,
      author,
      image_url,
      status,
      published_at,
      created_at,
      is_breaking
    `)
    .eq("status","published")
    .order("published_at",{
      ascending:false
    });


  if(error){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="empty">

        Unable to load news.

        <br>

        <small>
          ${esc(error.message)}
        </small>

      </div>

    `;

    return;

  }


  const articles =
    data || [];


  if(!articles.length){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="empty">
        No published news yet.
      </div>

    `;

    return;

  }


  /* =========================
     CATEGORY
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const selectedCategory =
    params.get("category");


  /* =========================
     BREAKING NEWS
  ========================= */

  const breaking =
    articles
      .filter(
        a => a.is_breaking === true
      )
      .slice(0,5);


  if(breaking.length){

    document.getElementById(
      "breaking"
    ).style.display =
      "block";


    const ticker =
      document.getElementById(
        "ticker"
      );


    const text =
      breaking
        .map(a => a.title)
        .join("   •   ");


    ticker.innerHTML =
      `<span>${esc(text)}</span>`;

  }


  /* =========================
     CATEGORY PAGE
  ========================= */

  if(selectedCategory){

    const filtered =
      articles.filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          selectedCategory.toLowerCase()
      );


    document.getElementById(
      "app"
    ).innerHTML = `

      <section class="section">

        <div class="section-head">

          <h2>
            ${esc(selectedCategory)}
            NEWS
          </h2>

          <a
            class="viewall"
            href="/"
          >
            ← HOME
          </a>

        </div>


        ${
          filtered.length

          ?

          `<div class="grid">
            ${filtered.map(card).join("")}
          </div>`

          :

          `<div class="empty">
            No ${esc(selectedCategory)}
            news found.
          </div>`

        }

      </section>

    `;

    return;

  }


  /* =========================
     HOMEPAGE DATA
  ========================= */

  const hero =
    articles[0];

  const side =
    articles.slice(1,4);

  const featured =
    articles.slice(0,4);

  const latest =
    articles.slice(0,6);


  const london =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "london"
      )
      .slice(0,6);


  const uk =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "uk"
      )
      .slice(0,6);


  const world =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "world"
      )
      .slice(0,6);


  const business =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "business"
      )
      .slice(0,6);


  const technology =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "technology"
      )
      .slice(0,6);


  const sports =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "sports"
      )
      .slice(0,6);


  const video =
    articles
      .filter(
        a =>
          String(a.category || "")
            .toLowerCase()
          ===
          "video"
      )
      .slice(0,6);


  /* =========================
     RENDER HOMEPAGE
  ========================= */

  document.getElementById(
    "app"
  ).innerHTML = `


    <!-- TOP STORY -->

    <section class="hero">

      <a
        class="hero-main"
        href="${articleUrl(hero)}"
      >

        <img
          src="${esc(
            imageOrFallback(
              hero.image_url
            )
          )}"
          alt="${esc(hero.title)}"
        >

        <div class="hero-overlay">

          <div class="label">
            TOP STORY
          </div>

          ${
            hero.is_breaking
            ?
            '<div class="breaking-badge">BREAKING NEWS</div>'
            :
            ''
          }

          <div class="hero-title">
            ${esc(hero.title)}
          </div>

          <p class="hero-excerpt">
            ${esc(hero.excerpt || "")}
          </p>

        </div>

      </a>


      <div class="side">

        ${side
          .map(sideCard)
          .join("")}

      </div>

    </section>


    <!-- FEATURED NEWS -->

    <section class="section">

      <div class="section-head">

        <h2>
          FEATURED NEWS
        </h2>

      </div>


      <div class="featured">

        ${
          featured
            .map(
              a => `

                <a
                  class="featured-card"
                  href="${articleUrl(a)}"
                >

                  <img
                    src="${esc(
                      imageOrFallback(
                        a.image_url
                      )
                    )}"
                    alt="${esc(a.title)}"
                    loading="lazy"
                  >

                  <div class="featured-body">

                    <div class="category">
                      ${esc(a.category)}
                    </div>

                    <h3>
                      ${esc(a.title)}
                    </h3>

                  </div>

                </a>

              `
            )
            .join("")
        }

      </div>
